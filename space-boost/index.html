<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ホロジュール+ SPACE BOOST</title>
  <meta name="theme-color" content="#04020a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 2 L37 27 L62 32 L37 37 L32 62 L27 37 L2 32 L27 27Z' fill='%23ffd7ec'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Outfit:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff6b9d;
      --blue: #00d4ff;
      --purple: #b388ff;
      --live: #ff3b5c;
      --gold: #ffe7a8;
      --cyan: #7fe8ff;
      --glass: rgba(10, 8, 26, 0.52);
      --glass-strong: rgba(10, 8, 26, 0.78);
      --line: rgba(255, 255, 255, 0.12);
      --text: #ece9ff;
      --muted: #8f8ab5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #04020a;
      color: var(--text);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    #space {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #space.dragging { cursor: grabbing; }
    #space.pointing { cursor: pointer; }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 1.2s ease 0.6s;
    }
    body.ready .hud { opacity: 1; }
    .hud > * { pointer-events: auto; }

    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-radius: 18px;
    }

    /* ===== brand ===== */
    .brand {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px 10px 12px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.8));
      animation: spin 18s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .brand-sub {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.42em;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand a {
      margin-left: 4px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
    }
    .brand a:hover { color: var(--text); border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); }

    .mode-switch {
      display: flex;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
    }
    .mode-switch button {
      padding: 5px 11px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .mode-switch button:hover { color: var(--text); }
    .mode-switch button.active {
      color: #fff;
      background: linear-gradient(120deg, rgba(255,107,157,0.55), rgba(179,136,255,0.55));
      box-shadow: 0 0 14px rgba(179,136,255,0.45);
    }

    /* ===== chronometer ===== */
    .chrono {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      padding: 12px 18px 12px 20px;
      text-align: right;
      min-width: 190px;
    }
    .chrono-label {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      color: var(--muted);
    }
    .chrono-time {
      font-family: 'Outfit', sans-serif;
      font-weight: 200;
      font-size: 44px;
      line-height: 1;
      letter-spacing: 0.02em;
      margin: 4px 0 2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px rgba(179, 136, 255, 0.55);
    }
    .chrono-date { font-size: 12px; color: #c9c4ee; }
    .chrono-rel {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      background: rgba(255,255,255,0.08);
      color: #d9d4ff;
    }
    .chrono-rel.is-now { background: var(--live); color: #fff; box-shadow: 0 0 16px rgba(255,59,92,0.7); }
    .chrono-rel.is-future { background: rgba(0, 212, 255, 0.16); color: #9eeaff; }
    .chrono-rel.is-past { background: rgba(150, 140, 200, 0.14); color: #b9b3dc; }
    .now-btn {
      display: block;
      margin: 10px 0 0 auto;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 59, 92, 0.5);
      background: rgba(255, 59, 92, 0.12);
      color: #ffb3c3;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.25s;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
    }
    .now-btn.show { opacity: 1; transform: none; pointer-events: auto; }
    .now-btn:hover { background: rgba(255, 59, 92, 0.3); color: #fff; box-shadow: 0 0 18px rgba(255,59,92,0.5); }

    /* ===== signal radar ===== */
    .radar {
      position: absolute;
      top: calc(max(16px, env(safe-area-inset-top)) + 70px);
      left: 16px;
      width: 214px;
      padding: 10px 12px 10px;
    }
    .radar-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--cyan);
      margin-bottom: 6px;
    }
    .radar-head span { color: var(--muted); letter-spacing: 0.1em; font-weight: 600; }
    #radar-cv {
      display: block;
      width: 190px;
      height: 190px;
      cursor: crosshair;
    }
    .radar-log {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 104px;
      overflow: hidden;
    }
    .radar-log li {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
      line-height: 1.35;
      color: #cfc9f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: logIn 0.6s ease both;
      cursor: default;
    }
    .radar-log li.clickable { cursor: pointer; }
    .radar-log li.clickable:hover { color: #fff; }
    .radar-log li time {
      font-family: 'Outfit', sans-serif;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .radar-log li i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--c, var(--cyan));
      box-shadow: 0 0 6px var(--c, var(--cyan));
    }
    .radar-log li b { font-family: 'Outfit', sans-serif; font-size: 9.5px; letter-spacing: 0.14em; flex-shrink: 0; }
    .radar-log .log-new b { color: var(--cyan); }
    .radar-log .log-ignite b { color: #ff8da5; }
    .radar-log .log-lost b { color: var(--muted); }
    .radar-log .log-scan b { color: var(--gold); }
    .radar-log li span { overflow: hidden; text-overflow: ellipsis; }
    @keyframes logIn { from { opacity: 0; transform: translateX(-8px); } }

    /* ===== ON AIR dock ===== */
    .dock {
      position: absolute;
      left: 16px;
      bottom: 104px;
      max-width: min(56vw, 520px);
      padding: 10px 14px 12px;
    }
    .dock-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: #ffb3c3;
      margin-bottom: 8px;
    }
    .dock-label b { font-size: 14px; color: #fff; letter-spacing: 0.05em; }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.35; transform: scale(0.75); } }
    .dock-icons { display: flex; flex-wrap: wrap; gap: 6px; }
    .dock-icons button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 0;
      border: 2px solid var(--c, #fff);
      background: #111 center / cover no-repeat;
      cursor: pointer;
      box-shadow: 0 0 12px var(--c, #fff);
      transition: transform 0.2s;
    }
    .dock-icons button:hover { transform: scale(1.18); }
    .dock-empty { font-size: 12px; color: var(--muted); }

    /* ===== NEXT star ===== */
    .next {
      position: absolute;
      right: 16px;
      bottom: 104px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 10px 10px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      max-width: min(44vw, 380px);
      transition: transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 0 30px rgba(255, 231, 168, 0.12);
    }
    .next:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(255, 231, 168, 0.3); }
    .next img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--c, #fff);
      box-shadow: 0 0 18px var(--c, #fff);
      flex-shrink: 0;
      object-fit: cover;
    }
    .next-info { min-width: 0; }
    .next-label {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: var(--gold);
    }
    .next-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .next-count {
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      color: #ffd6e5;
      font-variant-numeric: tabular-nums;
    }
    .next.hidden { display: none; }

    /* ===== timeline ===== */
    .timeline {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: max(16px, env(safe-area-inset-bottom));
      height: 72px;
      padding: 0 18px;
      cursor: ew-resize;
      touch-action: none;
    }
    .tl-inner { position: absolute; inset: 0 18px; }
    .tl-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 44px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25) 8%, rgba(255,255,255,0.25) 92%, transparent);
    }
    .tl-dot {
      position: absolute;
      bottom: 28px;
      width: 3px;
      margin-left: -1.5px;
      border-radius: 2px;
      opacity: 0.85;
      box-shadow: 0 0 6px currentColor;
    }
    .tl-dot.live {
      width: 5px;
      margin-left: -2.5px;
      opacity: 1;
      outline: 1px solid #fff;
    }
    .tl-dot.past { opacity: 0.28; box-shadow: none; }
    .tl-dot.new { outline: 1px solid var(--cyan); animation: blipNew 0.9s ease-in-out infinite; }
    @keyframes blipNew { 50% { transform: scaleY(1.8); opacity: 1; } }
    .tl-day {
      position: absolute;
      top: 50px;
      transform: translateX(-50%);
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--muted);
      white-space: nowrap;
    }
    .tl-day::before {
      content: '';
      position: absolute;
      left: 50%;
      top: -10px;
      width: 1px;
      height: 8px;
      background: rgba(255,255,255,0.4);
    }
    .tl-now {
      position: absolute;
      top: 8px;
      bottom: 22px;
      width: 2px;
      margin-left: -1px;
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
    }
    .tl-now::after {
      content: 'NOW';
      position: absolute;
      top: -2px;
      left: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #ff9fb3;
    }
    .tl-view {
      position: absolute;
      top: 4px;
      bottom: 18px;
      width: 46px;
      margin-left: -23px;
      border-radius: 10px;
      border: 1px solid rgba(179, 220, 255, 0.7);
      background: linear-gradient(180deg, rgba(0,212,255,0.18), rgba(179,136,255,0.08));
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.35), inset 0 0 12px rgba(0, 212, 255, 0.2);
      pointer-events: none;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 102px;
      transform: translateX(-50%);
      padding: 8px 18px;
      font-size: 12px;
      color: #cfc9f5;
      letter-spacing: 0.06em;
      white-space: nowrap;
      transition: opacity 1s;
      pointer-events: none;
    }
    .hint b { color: #fff; font-weight: 700; }
    .hint.gone { opacity: 0; }

    /* ===== tooltip ===== */
    .tooltip {
      position: fixed;
      z-index: 20;
      max-width: 320px;
      padding: 10px 14px;
      pointer-events: none;
      opacity: 0;
      transform: translate(16px, 16px);
      transition: opacity 0.15s;
      border-left: 3px solid var(--c, #fff);
    }
    .tooltip.show { opacity: 1; }
    .tooltip .tt-name { font-weight: 700; font-size: 13px; }
    .tooltip .tt-title { font-size: 11px; color: #cfc9f5; line-height: 1.5; margin-top: 3px; }
    .tooltip .tt-time { font-family: 'Outfit', sans-serif; font-size: 11px; color: var(--c, #fff); margin-top: 4px; letter-spacing: 0.06em; }

    /* ===== capture panel ===== */
    .panel {
      position: fixed;
      z-index: 30;
      top: 50%;
      right: 4vw;
      width: min(400px, 36vw);
      padding: 26px 26px 24px;
      transform: translate(40px, -50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.6s cubic-bezier(.2,.9,.2,1);
      background: var(--glass-strong);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 0 60px color-mix(in srgb, var(--c, #fff) 30%, transparent);
    }
    .panel::before {
      content: '';
      position: absolute;
      left: 0; top: 18px; bottom: 18px;
      width: 3px;
      border-radius: 3px;
      background: var(--c, #fff);
      box-shadow: 0 0 14px var(--c, #fff);
    }
    .panel.show { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
    .panel-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }
    .panel-close:hover { background: rgba(255,255,255,0.14); }
    .p-state {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.35em;
      color: var(--gold);
    }
    .p-state[data-state="live"] { color: #ff8da5; }
    .p-state[data-state="past"] { color: var(--muted); }
    .p-time {
      margin-top: 6px;
      font-size: 13px;
      color: #d5d0f7;
      font-variant-numeric: tabular-nums;
    }
    .p-title {
      margin: 14px 0 16px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.55;
      word-break: break-word;
    }
    .p-talent { display: flex; align-items: center; gap: 12px; }
    .p-talent img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid var(--c, #fff);
      box-shadow: 0 0 16px var(--c, #fff);
      object-fit: cover;
    }
    .p-name { font-size: 15px; font-weight: 700; }
    .p-collabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
    .p-collabs:empty { display: none; }
    .p-collabs span {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-right: 4px;
    }
    .p-collabs img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--cc, #fff); object-fit: cover; }
    .p-go {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      padding: 14px;
      border-radius: 14px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.08em;
      background: linear-gradient(120deg, color-mix(in srgb, var(--c, #ff6b9d) 85%, #000), var(--c, #ff6b9d) 60%, color-mix(in srgb, var(--c, #ff6b9d) 55%, #fff));
      box-shadow: 0 0 26px color-mix(in srgb, var(--c, #ff6b9d) 60%, transparent);
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .p-go:hover { transform: translateY(-2px); box-shadow: 0 0 40px var(--c, #ff6b9d); }

    /* ===== toasts ===== */
    .toasts {
      position: fixed;
      z-index: 40;
      top: max(84px, calc(env(safe-area-inset-top) + 84px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px 14px 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--glass-strong);
      border: 1px solid color-mix(in srgb, var(--c, #fff) 60%, transparent);
      border-radius: 20px;
      box-shadow: 0 0 60px color-mix(in srgb, var(--c, #fff) 55%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: toastIn 0.9s cubic-bezier(.2,1.4,.3,1) both;
    }
    .toast.out { animation: toastOut 0.6s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: scale(0.4); filter: blur(10px); } }
    @keyframes toastOut { to { opacity: 0; transform: scale(1.3); filter: blur(12px); } }
    .toast img { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--c, #fff); object-fit: cover; }
    .toast-kicker { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.35em; color: #ff8da5; }
    .toast.detect .toast-kicker { color: var(--cyan); }
    .toast-name { font-weight: 700; font-size: 16px; }
    .toast-title { font-size: 11px; color: #cfc9f5; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== loader ===== */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(ellipse at center, #120a26 0%, #04020a 70%);
      transition: opacity 1.4s ease, visibility 1.4s;
    }
    body.ready .loader { opacity: 0; visibility: hidden; }
    .loader-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      border-top-color: var(--pink);
      border-right-color: var(--blue);
      animation: spin 1.1s linear infinite;
      box-shadow: 0 0 40px rgba(179,136,255,0.25);
    }
    .loader-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 200;
      font-size: 28px;
      letter-spacing: 0.6em;
      padding-left: 0.6em;
    }
    .loader-msg { font-size: 12px; color: var(--muted); letter-spacing: 0.2em; }

    .dock, .next, .timeline, .radar { transition: opacity 0.4s; }

    /* 高さの低い画面ではレーダーのログを畳む */
    @media (max-height: 760px) {
      .radar-log { max-height: 44px; }
    }
    @media (max-height: 640px) {
      .radar-log { display: none; }
    }

    /* ===== mobile ===== */

  <script type="module">
    // フルURLで読む（Vite開発サーバーが素のimportを解決しようとするのを避ける）
    // addons内部の `import 'three'` は importmap で解決される
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/postprocessing/OutputPass.js';

    // ================================================================
    //  定数・ユーティリティ
    // ================================================================
    const API_URL = 'https://schedule.hololive.tv/api/list/7';
    const COLORS_URL = '../talent-colors.json';
    const REFRESH_MS = 30000;

    const HOUR = 3600000;
    const Z_PER_HOUR = 34;      // TUNNEL: 1時間 = 奥行き34ユニット
    const FOCUS_DIST = 70;      // TUNNEL: カメラ → 注視面（=見ている時刻）の距離
    const CARD_W = 16, CARD_H = 12.5;
    const CW = 640, CH = 500;   // カードテクスチャ解像度
    const RING_R = 58;          // TUNNEL: 時刻リングの半径
    const TAU = Math.PI * 2;
    const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
    const WEEK_EN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const T0 = Date.now();      // 銀河ダストの時刻基準

    // GALAXY: 時間 → 渦巻の形
    //   過去 a時間前 → 円盤上の半径 r(a)。腕は r に比例してねじれる
    //   未来 h時間後 → 核の上空に伸びる漏斗（高さ yF, 半径 rF）
    const G = {
      r: (a) => 16 + 22 * Math.pow(Math.max(a, 0), 0.7),
      twist: 0.018,
      yF: (h) => 10 + 26 * Math.pow(Math.max(h, 0), 0.7),
      rF: (h) => 12 + 14 * Math.sqrt(Math.max(h, 0)),
    };

    const $ = (s) => document.querySelector(s);
    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
    const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const approach = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));
    const pad = (n) => String(n).padStart(2, '0');
    const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(TAU * Math.random());

    function fnv(str, salt = '') {
      let h = 2166136261;
      const s = salt + str;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return (h >>> 0) / 4294967295;
    }

    // APIの日時はJST固定
    const parseT = (s) => new Date(s.replace(/\//g, '-').replace(' ', 'T') + '+09:00').getTime();
    function jst(t) {
      const d = new Date(t + 9 * HOUR);
      return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, da: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), wd: d.getUTCDay() };
    }
    const hm = (t) => { const p = jst(t); return `${pad(p.h)}:${pad(p.mi)}`; };
    const videoId = (v) => (v.url.match(/[?&]v=([^&]+)/) || [])[1] || v.url;

    // 本家と同じ判定：API isLive または 開始時刻から10分以内
    function isLiveV(v, now) {
      if (v.isLive) return true;
      const el = now - parseT(v.datetime);
      return el >= 0 && el <= 10 * 60000;
    }

    function untilText(ms) {
      const m = Math.max(1, Math.ceil(ms / 60000));
      if (m < 60) return `あと${m}分`;
      const h = Math.floor(m / 60), mm = m % 60;
      if (h < 24) return `あと${h}時間${mm ? mm + '分' : ''}`;
      return `あと${Math.floor(h / 24)}日`;
    }
    function elapsedText(ms) {
      const m = Math.max(0, Math.floor(ms / 60000));
      const h = Math.floor(m / 60);
      return `${h ? h + '時間' : ''}${m % 60}分経過`;
    }
    function agoText(ms) {
      const m = Math.max(0, Math.floor(ms / 60000));
      if (m < 60) return `${m}分前`;
      const h = Math.floor(m / 60);
      return h < 24 ? `${h}時間前` : `${Math.floor(h / 24)}日前`;
    }
    function relText(ms) {
      const m = Math.round(Math.abs(ms) / 60000);
      if (m < 3) return 'NOW';
      const h = Math.floor(m / 60), mm = m % 60;
      const body = h ? `${h}h ${pad(mm)}m` : `${mm}m`;
      return ms > 0 ? `+${body} FUTURE` : `−${body} PAST`;
    }

    // ================================================================
    //  タレントカラー
    // ================================================================
    const talentColors = new Map();
    async function loadTalentColors() {
      try {
        const res = await fetch(COLORS_URL);
        (await res.json()).forEach((t) => talentColors.set(t.name, t.official_color1 || t.holodule_color));
      } catch (e) {
        console.warn('talent-colors.json の読み込みに失敗:', e);
      }
    }
    const hexCache = new Map();
    function talentHex(name) {
      if (hexCache.has(name)) return hexCache.get(name);
      const c = new THREE.Color();
      const raw = talentColors.get(name);
      if (raw) {
        c.set(raw);
        const hsl = c.getHSL({}, THREE.SRGBColorSpace);
        const s = hsl.s < 0.08 ? hsl.s : Math.max(hsl.s, 0.4);
        c.setHSL(hsl.h, s, clamp(hsl.l, 0.5, 0.72), THREE.SRGBColorSpace);
      } else {
        c.setHSL(fnv(name), 0.75, 0.64, THREE.SRGBColorSpace);
      }
      const hex = '#' + c.getHexString(THREE.SRGBColorSpace);
      hexCache.set(name, hex);
      return hex;
    }

    // ================================================================
    //  画像ロード（全てCORS OK: i.ytimg.com / yt3.ggpht.com）
    // ================================================================
    // yt3.ggpht.com は一気に叩くと 429 を返すので、同時接続数を絞ってリトライする
    const imgCache = new Map();
    const imgQueue = [];
    let imgActive = 0;
    const IMG_CONCURRENCY = 4;
    function pumpImgQueue() {
      while (imgActive < IMG_CONCURRENCY && imgQueue.length) {
        const job = imgQueue.shift();
        imgActive++;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.decoding = 'async';
        const done = (ok) => {
          imgActive--;
          if (ok) job.resolve(img);
          else if (job.retry && job.attempt < 3) {
            job.attempt++;
            setTimeout(() => { imgQueue.push(job); pumpImgQueue(); }, 1200 * job.attempt + Math.random() * 800);
          } else job.resolve(null);
          pumpImgQueue();
        };
        img.onload = () => done(true);
        img.onerror = () => done(false);
        img.src = job.url;
      }
    }
    function loadImg(url, retry = true) {
      if (!url) return Promise.resolve(null);
      if (!imgCache.has(url)) {
        imgCache.set(url, new Promise((resolve) => {
          imgQueue.push({ url, resolve, retry, attempt: 0 });
          pumpImgQueue();
        }));
      }
      return imgCache.get(url);
    }
    async function loadThumb(v) {
      const id = videoId(v);
      if (/^[\w-]{11}$/.test(id)) {
        for (const q of ['maxresdefault', 'hqdefault']) {
          const img = await loadImg(`https://i.ytimg.com/vi/${id}/${q}.jpg`, false);
          if (img && img.naturalWidth > 200) return img; // 404画像(120x90)は除外
        }
      }
      return loadImg(v.thumbnail);
    }

    // ================================================================
    //  Canvas 2D 描画ヘルパー
    // ================================================================
    function rrect(g, x, y, w, h, r) {
      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r);
      g.closePath();
    }
    function drawCover(g, img, x, y, w, h) {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const ir = iw / ih, r = w / h;
      let sw, sh, sx, sy;
      if (ir > r) { sh = ih; sw = sh * r; sx = (iw - sw) / 2; sy = 0; }
      else { sw = iw; sh = sw / r; sx = 0; sy = (ih - sh) / 2; }
      g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }
    function pill(g, x, y, text, bg, fg = '#fff', dot = null) {
      g.font = '700 27px Outfit, "Zen Kaku Gothic New", sans-serif';
      const w = g.measureText(text).width + 34 + (dot ? 24 : 0);
      const h = 46;
      g.fillStyle = bg;
      rrect(g, x, y, w, h, 23);
      g.fill();
      let tx = x + 17;
      if (dot) {
        g.fillStyle = dot;
        g.beginPath(); g.arc(x + 24, y + h / 2, 8, 0, TAU); g.fill();
        tx += 24;
      }
      g.fillStyle = fg;
      g.textBaseline = 'middle';
      g.fillText(text, tx, y + h / 2 + 1);
      g.textBaseline = 'alphabetic';
    }
    function fitText(g, text, x, y, maxW, size, weight = 700) {
      let s = size;
      do {
        g.font = `${weight} ${s}px "Zen Kaku Gothic New", sans-serif`;
        if (g.measureText(text).width <= maxW) break;
        s -= 2;
      } while (s > 20);
      let t = text;
      while (g.measureText(t).width > maxW && t.length > 1) t = t.slice(0, -1);
      g.fillText(t === text ? t : t.slice(0, -1) + '…', x, y);
    }

    // ================================================================
    //  レンダラー / シーン
    // ================================================================
    const canvas = $('#space');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      $('#loader-msg').textContent = 'WebGL が利用できない環境です。通常版をご利用ください。';
      throw e;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NoToneMapping;
    const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
    const PR = renderer.getPixelRatio();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04020a);
    scene.fog = new THREE.FogExp2(0x05030d, 0.0015);

    const BASE_FOV = 62;
    const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 7000);
    camera.position.set(0, 60, 260);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.05, 0.62, 0.88);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    const uTime = { value: 0 };
    const quadGeo = new THREE.PlaneGeometry(1, 1);
    const cardGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);
    const CYAN = new THREE.Color(0x7fe8ff);

    let sx = 1; // TUNNEL: 縦長画面では横方向を圧縮
    const isNarrow = () => window.innerWidth < 760;
    function updateAspect() {
      sx = clamp(camera.aspect / 1.5, 0.42, 1);
    }
    updateAspect();

    // 形態：GALAXY（渦巻銀河）/ TUNNEL（時空トンネル）
    let mode = 'galaxy';
    try { mode = localStorage.getItem('space-boost-mode') === 'tunnel' ? 'tunnel' : 'galaxy'; } catch (e) { /* 既定のまま */ }
    let modeK = mode === 'galaxy' ? 1 : 0;   // 0=TUNNEL 〜 1=GALAXY（フェード用）
    let modeSwitchT = 1;

    // ================================================================
    //  背景：星雲・恒星・ワープダスト
    // ================================================================
    const nebula = new THREE.Mesh(
      new THREE.SphereGeometry(3200, 48, 32),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: { uTime },
        vertexShader: /* glsl */`
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: /* glsl */`
          uniform float uTime;
          varying vec3 vDir;
          float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
          float noise(vec3 x) {
            vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
            return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                       mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
          }
          float fbm(vec3 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 6; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
          void main() {
            vec3 d = normalize(vDir);
            float t = uTime * 0.004;
            float n1 = fbm(d * 2.1 + vec3(0.0, 0.0, t));
            float n2 = fbm(d * 4.3 + n1 * 1.7 - vec3(t, 0.0, 0.0));
            float n3 = fbm(d * 9.0 + n2 * 2.0);
            vec3 col = vec3(0.006, 0.003, 0.018);
            col += vec3(1.0, 0.22, 0.52) * pow(smoothstep(0.42, 0.88, n2), 2.2) * 0.10;
            col += vec3(0.0, 0.5, 1.0)   * pow(smoothstep(0.48, 0.92, n1), 2.0) * 0.085;
            col += vec3(0.55, 0.28, 1.0) * smoothstep(0.3, 0.75, n1 * n2 * 1.7) * 0.06;
            col *= 0.6 + 0.8 * n3;
            float fwd = max(dot(d, vec3(0.0, 0.0, -1.0)), 0.0);
            col += vec3(0.95, 0.55, 1.0) * pow(fwd, 22.0) * 0.18;
            col += vec3(1.0, 0.85, 0.7) * pow(fwd, 180.0) * 0.35;
            gl_FragColor = vec4(col, 1.0);
          }`
      })
    );
    nebula.renderOrder = -10;
    scene.add(nebula);

    // 遠景の恒星（カメラ追従＝無限遠）
    const starfield = (() => {
      const N = 9000;
      const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N), seed = new Float32Array(N);
      const palette = [[1, 1, 1], [0.75, 0.85, 1], [1, 0.8, 0.9], [0.8, 0.95, 1], [1, 0.93, 0.75], [0.85, 0.75, 1]];
      for (let i = 0; i < N; i++) {
        const u = Math.random() * 2 - 1, th = Math.random() * TAU, r = 1800 + Math.random() * 900;
        const s = Math.sqrt(1 - u * u);
        pos.set([Math.cos(th) * s * r, Math.sin(th) * s * r, u * r], i * 3);
        const p = palette[(Math.random() * palette.length) | 0];
        const big = Math.random() < 0.02;
        const b = big ? 1.4 : 0.35 + Math.random() * 0.6;
        col.set([p[0] * b, p[1] * b, p[2] * b], i * 3);
        size[i] = big ? 5 + Math.random() * 4 : 1.2 + Math.random() * 2.2;
        seed[i] = Math.random();
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
      const mat = new THREE.ShaderMaterial({
        uniforms: { uTime, uPR: { value: PR } },
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: /* glsl */`
          attribute vec3 aColor; attribute float aSize; attribute float aSeed;
          uniform float uTime, uPR;
          varying vec3 vColor; varying float vTw;
          void main() {
            vColor = aColor;
            vTw = 0.55 + 0.45 * sin(uTime * (0.8 + aSeed * 3.0) + aSeed * 60.0);
            gl_PointSize = aSize * uPR;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: /* glsl */`
          varying vec3 vColor; varying float vTw;
          void main() {
            vec2 c = gl_PointCoord - 0.5;
            float d = length(c);
            float a = exp(-d * d * 26.0);
            if (a < 0.01) discard;
            gl_FragColor = vec4(vColor * a * vTw, 1.0);
          }`
      });
      const pts = new THREE.Points(geo, mat);
      pts.frustumCulled = false;
      pts.renderOrder = -9;
      scene.add(pts);
      return pts;
    })();

    // TUNNEL: 近景のダスト。高速航行時に光の筋になる
    const dustMat = new THREE.ShaderMaterial({
      uniforms: { uCamZ: { value: 0 }, uVel: { value: 0 }, uK: { value: 1 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: /* glsl */`
        attribute float aEnd; attribute float aB;
        uniform float uCamZ, uVel, uK;
        varying float vA;
        void main() {
          vec3 p = position;
          p.z = uCamZ + 40.0 - mod(uCamZ + 40.0 - p.z, 440.0);
          p.z += aEnd * (0.5 + uVel);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          float far = 1.0 - smoothstep(160.0, 400.0, -mv.z);
          float near = smoothstep(2.0, 20.0, -mv.z);
          vA = uK * far * near * aB * (0.22 + min(abs(uVel) * 0.06, 0.9));
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying float vA;
        void main() { gl_FragColor = vec4(vec3(0.55, 0.72, 1.0) * vA, 1.0); }`
    });
    const dust = (() => {
      const N = 2200;
      const pos = new Float32Array(N * 6), end = new Float32Array(N * 2), br = new Float32Array(N * 2);
      for (let i = 0; i < N; i++) {
        const a = Math.random() * TAU, r = 8 + Math.pow(Math.random(), 0.7) * 150;
        const x = Math.cos(a) * r, y = Math.sin(a) * r, z = Math.random() * 440;
        const b = 0.4 + Math.random() * 0.8;
        pos.set([x, y, z, x, y, z], i * 6);
        end[i * 2] = 0; end[i * 2 + 1] = 1;
        br[i * 2] = b; br[i * 2 + 1] = b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aEnd', new THREE.BufferAttribute(end, 1));
      geo.setAttribute('aB', new THREE.BufferAttribute(br, 1));
      const lines = new THREE.LineSegments(geo, dustMat);
      lines.frustumCulled = false;
      scene.add(lines);
      return lines;
    })();

    // ================================================================
    //  シェーダー：恒星 / リング / 衝撃波 / 彗星の尾
    // ================================================================
    const QUAD_VERT = /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

    const STAR_FRAG = /* glsl */`
      varying vec2 vUv;
      uniform vec3 uColor;
      uniform float uIntensity, uTime, uSeed, uRays, uPulse, uFade, uLive, uElapsed;
      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float d = length(p);
        if (d > 1.0) discard;
        float a = atan(p.y, p.x);
        float core = exp(-d * d * 90.0) * 4.0 + exp(-d * 10.0) * 1.1;
        float halo = exp(-d * 3.6) * 0.45 + exp(-d * 1.5) * 0.10;
        // 十字の光条 + 斜め光条 + 細かいスパイク（神々しさ担当）
        float r1 = pow(abs(cos(a * 2.0 + uSeed)), 280.0) * exp(-d * 1.7) * 2.4;
        float r2 = pow(abs(cos(a * 2.0 + uSeed + 0.785 + uTime * 0.03)), 420.0) * exp(-d * 3.0) * 1.1;
        float r3 = pow(abs(sin(a * 7.0 + uTime * 0.11 + uSeed * 3.0)), 36.0) * exp(-d * 4.6) * 0.55;
        float rays = (r1 + r2 + r3) * uRays;
        // 開始間近：ソナーのように広がる波紋
        float ph = fract(uTime * 0.33 + uSeed);
        float pulse = exp(-pow((d - ph * 0.95) * 16.0, 2.0)) * (1.0 - ph) * 0.8 * uPulse;
        // 配信中：回転するコロナの弧
        float arc = exp(-pow((d - 0.42) * 30.0, 2.0)) * pow(0.5 + 0.5 * sin(a * 3.0 - uTime * 1.6 + uSeed), 3.0) * 1.2
                  + exp(-pow((d - 0.5) * 50.0, 2.0)) * pow(0.5 + 0.5 * sin(-a * 5.0 - uTime * 2.3), 6.0) * 0.8;
        // 配信中：経過時間ゲージ（真上から時計回り、3時間で一周）
        float u = fract(0.25 - a / 6.28318);
        float track = exp(-pow((d - 0.64) * 80.0, 2.0));
        float gauge = track * (0.15 + 1.1 * step(u, uElapsed));
        float tw = 0.88 + 0.12 * sin(uTime * 2.3 + uSeed * 9.0);
        float v = (core + halo + rays) * tw + pulse + (arc + gauge) * uLive;
        vec3 col = mix(uColor, vec3(1.0, 0.97, 0.92), clamp(core * 0.35 + r1 * 0.2 + gauge * 0.3 * uLive, 0.0, 1.0));
        float edge = smoothstep(1.0, 0.75, d);
        gl_FragColor = vec4(col * v * uIntensity * uFade * edge, 1.0);
      }`;

    function makeStarMaterial(color) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: color.clone() },
          uIntensity: { value: 1 },
          uTime,
          uSeed: { value: Math.random() * TAU },
          uRays: { value: 1 },
          uPulse: { value: 0 },
          uFade: { value: 1 },
          uLive: { value: 0 },
          uElapsed: { value: 0 },
        },
        vertexShader: QUAD_VERT,
        fragmentShader: STAR_FRAG,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    const RING_FRAG = /* glsl */`
      varying vec2 vUv;
      uniform vec3 uColor;
      uniform float uOpacity, uTime, uDash, uSpin, uTicks, uGlow;
      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float d = length(p);
        float a = atan(p.y, p.x) / 6.28318 + 0.5;
        float line = exp(-pow((d - 0.94) * 260.0, 2.0));
        float glow = exp(-pow((d - 0.94) * 28.0, 2.0)) * 0.14 * uGlow;
        float dash = uDash > 0.5 ? step(0.45, fract(a * uDash + uTime * uSpin)) : 1.0;
        // 24分割（=24時間）の短い目盛り
        float tk = smoothstep(0.0025, 0.0, abs(fract(a * 24.0 + 0.5) - 0.5) / 24.0 * 6.28318 * d)
                 * smoothstep(0.895, 0.9, d) * smoothstep(0.925, 0.92, d) * uTicks;
        gl_FragColor = vec4(uColor * ((line + glow) * dash + tk * 0.6) * uOpacity, 1.0);
      }`;
    function makeRingMaterial(color, opacity, dash = 0, spin = 0, ticks = 1) {
      const m = new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(color) },
          uOpacity: { value: opacity },
          uTime,
          uDash: { value: dash },
          uSpin: { value: spin },
          uTicks: { value: ticks },
          uGlow: { value: dash > 0 ? 0 : 1 },
        },
        vertexShader: QUAD_VERT,
        fragmentShader: RING_FRAG,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
      });
      m.userData.base = opacity;
      return m;
    }

    const SHOCK_FRAG = /* glsl */`
      varying vec2 vUv;
      uniform vec3 uColor;
      uniform float uP;
      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float d = length(p);
        float ring = exp(-pow((d - uP * 0.95) * 12.0, 2.0)) * (1.0 - uP) * 3.0;
        float ring2 = exp(-pow((d - uP * 0.6) * 22.0, 2.0)) * (1.0 - uP) * 1.5;
        float flash = exp(-d * d * 30.0) * pow(1.0 - uP, 4.0) * 3.0;
        vec3 col = mix(uColor, vec3(1.0), clamp(flash * 0.3, 0.0, 1.0));
        gl_FragColor = vec4(col * (ring + ring2 + flash) * smoothstep(1.0, 0.9, d), 1.0);
      }`;

    // 配信中の星が引く「彗星の尾」：開始時刻の位置 → 現在位置
    const TAIL_N = 56;
    const tailIndex = [];
    for (let i = 0; i < TAIL_N - 1; i++) {
      const a = i * 2;
      tailIndex.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const TAIL_VERT = /* glsl */`
      attribute float aS; attribute float aSide;
      varying float vS; varying float vSide;
      void main() { vS = aS; vSide = aSide; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const TAIL_FRAG = /* glsl */`
      uniform vec3 uColor; uniform float uAlpha, uTime;
      varying float vS; varying float vSide;
      void main() {
        float along = pow(1.0 - vS, 1.3) * 0.85 + 0.15;
        float across = exp(-vSide * vSide * 2.6);
        float flow = 0.7 + 0.3 * sin(vS * 46.0 - uTime * 5.0);
        vec3 col = mix(uColor, vec3(1.0), pow(1.0 - vS, 8.0) * 0.7);
        gl_FragColor = vec4(col * along * across * flow * uAlpha * 1.3, 1.0);
      }`;

    // ================================================================
    //  テキストスプライト
    // ================================================================
    function makeTextSprite(text, { size = 64, weight = 600, color = '#ffffff', height = 4, glow = null, family = 'Outfit, "Zen Kaku Gothic New", sans-serif' } = {}) {
      const c = document.createElement('canvas');
      const g = c.getContext('2d');
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      let current = null;
      sprite.userData.setText = (t) => {
        if (t === current) return;
        current = t;
        const font = `${weight} ${size}px ${family}`;
        g.font = font;
        const w = Math.ceil(g.measureText(t).width + size);
        c.width = w; c.height = Math.ceil(size * 1.6);
        g.font = font;
        g.textBaseline = 'middle';
        if (glow) { g.shadowColor = glow; g.shadowBlur = size * 0.45; }
        g.fillStyle = color;
        g.fillText(t, size / 2, c.height / 2);
        tex.dispose();
        tex.needsUpdate = true;
        sprite.scale.set(height * c.width / c.height, height, 1);
      };
      sprite.userData.setText(text);
      return sprite;
    }
    function disposeSprite(s) { s.material.map?.dispose(); s.material.dispose(); }

    // ================================================================
    //  TUNNEL: NOW ゲート
    // ================================================================
    const nowGate = new THREE.Group();
    const gateOuter = new THREE.Mesh(quadGeo, makeRingMaterial(0xff3b5c, 1.6, 0, 0, 1));
    const gateInner = new THREE.Mesh(quadGeo, makeRingMaterial(0xff9ab8, 0.9, 120, 0.012, 0));
    const gateHaze = new THREE.Mesh(quadGeo, makeRingMaterial(0xb388ff, 0.7, 5, -0.008, 0));
    nowGate.add(gateOuter, gateInner, gateHaze);
    const nowLabel = makeTextSprite('NOW', { size: 72, weight: 700, color: '#ffd1dc', height: 5.5, glow: '#ff3b5c' });
    nowLabel.material.color.setScalar(1.5);
    nowGate.add(nowLabel);
    scene.add(nowGate);

    // ================================================================
    //  GALAXY: 銀河核・降着円盤・観測リング・腕のダスト
    // ================================================================
    const galaxy = new THREE.Group();
    scene.add(galaxy);
    const coreStar = new THREE.Mesh(quadGeo, makeStarMaterial(new THREE.Color(1.0, 0.72, 0.88)));
    coreStar.material.uniforms.uRays.value = 0.5;
    coreStar.material.uniforms.uPulse.value = 0.4;
    const accretionA = new THREE.Mesh(quadGeo, makeRingMaterial(0xff7bb0, 1.3, 64, 0.02, 1));
    const accretionB = new THREE.Mesh(quadGeo, makeRingMaterial(0xb388ff, 1.0, 0, 0, 0));
    accretionA.rotation.x = accretionB.rotation.x = -Math.PI / 2;
    const focusRing = new THREE.Mesh(quadGeo, makeRingMaterial(0x7fe8ff, 1.5, 0, 0, 1));
    focusRing.rotation.x = -Math.PI / 2;
    const nowLabelG = makeTextSprite('NOW', { size: 72, weight: 700, color: '#ffd1dc', height: 5, glow: '#ff3b5c' });
    nowLabelG.material.color.setScalar(1.5);
    galaxy.add(coreStar, accretionA, accretionB, focusRing, nowLabelG);

    // 渦巻の腕に沿った星屑。時刻(aT)と腕の角度だけ持たせ、位置はシェーダーで毎フレーム計算
    const gDustMat = new THREE.ShaderMaterial({
      uniforms: { uNowH: { value: 0 }, uSpin: { value: 0 }, uK: { value: 1 }, uPR: { value: PR }, uTime },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: /* glsl */`
        attribute float aT; attribute float aArm; attribute vec3 aOff; attribute vec3 aColor; attribute float aSize;
        uniform float uNowH, uSpin, uK, uPR, uTime;
        varying vec3 vColor; varying float vA;
        void main() {
          float a = uNowH - aT;
          float r = 16.0 + 22.0 * pow(max(a, 0.0), 0.7);
          float th = aArm + r * 0.018 + uSpin;
          vec3 p = vec3(cos(th) * r, 0.0, sin(th) * r) + aOff * (1.0 + max(a, 0.0) * 0.05);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          vColor = aColor;
          vA = uK * step(0.0, a) * (1.0 - smoothstep(34.0, 46.0, a)) * (0.75 + 0.25 * sin(uTime * 1.3 + aT * 40.0));
          gl_PointSize = min(aSize * uPR * (420.0 / max(-mv.z, 1.0)), 48.0);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying vec3 vColor; varying float vA;
        void main() {
          if (vA < 0.003) discard;
          vec2 c = gl_PointCoord - 0.5;
          float a = exp(-dot(c, c) * 22.0);
          gl_FragColor = vec4(vColor * a * vA, 1.0);
        }`
    });
    const gDust = new THREE.Points(new THREE.BufferGeometry(), gDustMat);
    gDust.frustumCulled = false;
    galaxy.add(gDust);

    function buildGalaxyDust(now) {
      const nowH = (now - T0) / HOUR;
      const T = [], ARM = [], OFF = [], COL = [], SIZE = [];
      const pal = [[0.55, 0.65, 1.0], [0.9, 0.55, 0.85], [0.7, 0.55, 1.0], [0.95, 0.9, 1.0], [0.5, 0.85, 1.0]];
      const push = (t, arm, ox, oy, oz, r, g, b, s) => { T.push(t); ARM.push(arm); OFF.push(ox, oy, oz); COL.push(r, g, b); SIZE.push(s); };
      // 背景の腕（3本）＋円盤のもや＋中心のバルジ
      for (let i = 0; i < 9000; i++) {
        const a = 42 * Math.pow(Math.random(), 1.45);
        const armed = Math.random() < 0.78;
        const armOff = armed ? ((Math.random() * 3) | 0) * TAU / 3 + gauss() * 0.3 : Math.random() * TAU;
        const p = pal[(Math.random() * pal.length) | 0];
        const b = (0.26 + Math.random() * 0.45) * (a < 2 ? 1.5 : 1);
        push(nowH - a, armOff, gauss() * 3, gauss() * (a < 3 ? 3 : 1.1), gauss() * 3, p[0] * b, p[1] * b, p[2] * b, 1.2 + Math.random() * 2.6);
      }
      // 配信ごとの星雲：その配信のタレントカラーで腕を染める
      entries.forEach((e) => {
        if (e.dying || e.t > now) return;
        const c = e.color;
        for (let k = 0; k < 42; k++) {
          const b = 0.35 + Math.random() * 0.55;
          push((e.t - T0) / HOUR + gauss() * 0.22, e.armOff + gauss() * 0.07,
            gauss() * 4.5, gauss() * 1.2, gauss() * 4.5, c.r * b, c.g * b, c.b * b, 1.8 + Math.random() * 3.4);
        }
      });
      const geo = new THREE.BufferGeometry();
      // position はダミー（シェーダーで計算）
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(T.length * 3), 3));
      geo.setAttribute('aT', new THREE.BufferAttribute(new Float32Array(T), 1));
      geo.setAttribute('aArm', new THREE.BufferAttribute(new Float32Array(ARM), 1));
      geo.setAttribute('aOff', new THREE.BufferAttribute(new Float32Array(OFF), 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(new Float32Array(COL), 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(SIZE), 1));
      gDust.geometry.dispose();
      gDust.geometry = geo;
    }

    // ================================================================
    //  配信エントリ（カード + 恒星 + 衛星 + 尾）
    // ================================================================
    /** @type {Map<string, any>} */
    const entries = new Map();
    let lives = [];
    let nextEntry = null;
    let focused = null;
    let hovered = null;
    let tMin = Date.now() - HOUR, tMax = Date.now() + HOUR;
    let dataLoaded = false;

    function stateOf(e, now) {
      if (isLiveV(e.v, now)) return 'live';
      return e.t > now ? 'future' : 'past';
    }

    function iconTexture(img, hex) {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const g = c.getContext('2d');
      g.save();
      g.beginPath(); g.arc(64, 64, 58, 0, TAU); g.clip();
      g.fillStyle = '#1a1830'; g.fillRect(0, 0, 128, 128);
      if (img) g.drawImage(img, 6, 6, 116, 116);
      g.restore();
      g.lineWidth = 9; g.strokeStyle = hex;
      g.beginPath(); g.arc(64, 64, 58, 0, TAU); g.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createEntry(v, now, intro) {
      const id = videoId(v);
      const e = {
        id, v,
        t: parseT(v.datetime),
        hash: fnv(id), hash2: fnv(id, 'z'), hash3: fnv(id, 'r'),
        hex: talentHex(v.talent.name),
        thumb: null, icon: null,
        drawKey: null,
        hover: 0, focusT: 0, appear: 1, dying: false,
        spawn: 0,
        spawnDelay: 0,
        liveIndex: 0,
        radarA: 0, radarR: 1, rx: -99, ry: -99,
        pos: new THREE.Vector3(),
        tail: null,
      };
      e.color = new THREE.Color(e.hex);
      e.baseR = 17 + e.hash3 * 24;
      e.armOff = Math.floor(e.hash * 3) * TAU / 3 + (e.hash2 - 0.5) * 0.55;
      e.yJit = (e.hash3 - 0.5) * 4;
      e.state = stateOf(e, now);

      e.canvas = document.createElement('canvas');
      e.canvas.width = CW; e.canvas.height = CH;
      e.tex = new THREE.CanvasTexture(e.canvas);
      e.tex.colorSpace = THREE.SRGBColorSpace;
      e.tex.anisotropy = MAX_ANISO;
      e.mat = new THREE.MeshBasicMaterial({ map: e.tex, transparent: true });
      e.mesh = new THREE.Mesh(cardGeo, e.mat);
      e.mesh.userData.entry = e;

      e.starMat = makeStarMaterial(e.color);
      e.star = new THREE.Mesh(quadGeo, e.starMat);
      e.star.position.z = -0.9;

      e.group = new THREE.Group();
      e.group.add(e.star, e.mesh);

      // コラボ相手は衛星としてカードの周りを公転
      e.sats = (v.collaboTalents || []).slice(0, 12).map((c) => {
        const mat = new THREE.SpriteMaterial({ transparent: true, alphaTest: 0.5 });
        const s = new THREE.Sprite(mat);
        s.visible = false;
        loadImg(c.iconImageUrl).then((img) => {
          mat.map = iconTexture(img, talentHex(c.name));
          mat.needsUpdate = true;
          s.visible = true;
        });
        e.group.add(s);
        return s;
      });

      // 奥から飛来する演出
      e.spawnDelay = intro ? 0.35 + clamp(Math.abs(e.t - now) / (40 * HOUR), 0, 1) * 1.6 + e.hash * 0.5 : 0.1;
      e.pos.set(0, 0, -3000);
      e.group.position.copy(e.pos);
      e.group.visible = false;
      scene.add(e.group);

      drawCard(e, now);
      loadThumb(v).then((img) => { e.thumb = img; drawCard(e); });
      loadImg(v.talent.iconImageUrl).then((img) => { e.icon = img; drawCard(e); });
      return e;
    }

    function disposeEntry(e) {
      scene.remove(e.group);
      e.tex.dispose(); e.mat.dispose(); e.starMat.dispose();
      e.sats.forEach((s) => { s.material.map?.dispose(); s.material.dispose(); });
      if (e.tlDot) e.tlDot.remove();
      if (e.tail) {
        scene.remove(e.tail.mesh, e.tail.label, e.tail.mark);
        e.tail.mesh.geometry.dispose(); e.tail.mesh.material.dispose();
        disposeSprite(e.tail.label); e.tail.mark.material.dispose();
      }
    }

    function cardKey(e, now) {
      if (e.state === 'live') return 'L' + Math.floor((now - e.t) / 60000);
      if (e.state === 'future') {
        const m = Math.ceil((e.t - now) / 60000);
        return 'F' + (m < 24 * 60 ? m : Math.floor(m / 1440) + 'd');
      }
      const m = Math.floor((now - e.t) / 60000);
      return 'P' + (m < 60 ? m : Math.floor(m / 60) + 'h');
    }

    function drawCard(e, now = Date.now()) {
      e.drawKey = cardKey(e, now);
      const g = e.canvas.getContext('2d');
      const v = e.v;
      const TH = 360;
      g.clearRect(0, 0, CW, CH);
      g.save();
      rrect(g, 3, 3, CW - 6, CH - 6, 30);
      g.clip();
      g.fillStyle = '#0b0918';
      g.fillRect(0, 0, CW, CH);

      if (e.thumb) {
        drawCover(g, e.thumb, 0, 0, CW, TH);
      } else {
        const gr = g.createLinearGradient(0, 0, CW, TH);
        gr.addColorStop(0, e.hex + '66'); gr.addColorStop(1, '#120f25');
        g.fillStyle = gr; g.fillRect(0, 0, CW, TH);
      }
      const sh = g.createLinearGradient(0, TH - 90, 0, TH);
      sh.addColorStop(0, 'rgba(8,6,20,0)'); sh.addColorStop(1, 'rgba(8,6,20,.55)');
      g.fillStyle = sh; g.fillRect(0, TH - 90, CW, 90);

      // タレントカラー帯
      const band = g.createLinearGradient(0, TH, CW, CH);
      band.addColorStop(0, e.hex); band.addColorStop(0.55, e.hex + '99'); band.addColorStop(1, '#0b0918');
      g.fillStyle = band; g.fillRect(0, TH, CW, CH - TH);
      g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(0, TH, CW, 2);

      // アイコン
      const cx = 78, cy = TH + (CH - TH) / 2, r = 52;
      g.save();
      g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.closePath();
      g.fillStyle = '#1a1830'; g.fill(); g.clip();
      if (e.icon) g.drawImage(e.icon, cx - r, cy - r, r * 2, r * 2);
      g.restore();
      g.lineWidth = 5; g.strokeStyle = 'rgba(255,255,255,.9)';
      g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();

      // 名前・時刻
      g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 10;
      g.fillStyle = '#fff';
      fitText(g, v.talent.name, 150, TH + 68, CW - 172, 40);
      g.font = '600 27px Outfit, "Zen Kaku Gothic New", sans-serif';
      g.fillStyle = 'rgba(255,255,255,.88)';
      const collabs = (v.collaboTalents || []).length;
      g.fillText(`${v.displayDate} 〜${collabs ? `    ✦ with ${collabs}` : ''}`, 150, TH + 112);
      g.shadowBlur = 0;

      // 状態バッジ
      if (e.state === 'live') {
        pill(g, 18, 18, `LIVE  ${elapsedText(now - e.t)}`, 'rgba(255,40,80,.95)', '#fff', '#fff');
      } else if (e.state === 'future') {
        const ms = e.t - now;
        if (ms < HOUR) pill(g, 18, 18, untilText(ms), 'rgba(255,80,150,.95)', '#fff', '#ffe7a8');
        else pill(g, 18, 18, `${v.displayDate}〜  ${untilText(ms)}`, 'rgba(6,4,18,.72)');
      } else {
        pill(g, 18, 18, `ARCHIVE · ${agoText(now - e.t)}`, 'rgba(30,28,48,.8)', '#cfcbe8');
      }
      g.restore();

      g.lineWidth = 6;
      g.strokeStyle = e.state === 'live' ? '#ffffff' : e.hex;
      rrect(g, 3, 3, CW - 6, CH - 6, 30);
      g.stroke();
      e.tex.needsUpdate = true;
    }

    const timeToZ = (t, now) => -((t - now) / HOUR) * Z_PER_HOUR;

    // 「a時間前」にこの星がいた場所（尾の軌跡に使う）
    function tunnelPast(e, a, out) {
      const z = a * Z_PER_HOUR + (e.hash2 - 0.5) * 7;
      const ang = e.hash * TAU + spin + z * 0.0045;
      return out.set(Math.cos(ang) * e.baseR * sx, Math.sin(ang) * e.baseR * 0.82, z);
    }
    function galaxyPast(e, a, out) {
      const r = G.r(a);
      const th = e.armOff + r * G.twist + spin;
      return out.set(Math.cos(th) * r, e.yJit * (1 + a * 0.06), Math.sin(th) * r);
    }
    const pastPos = (e, a, out) => (mode === 'tunnel' ? tunnelPast(e, a, out) : galaxyPast(e, a, out));

    // 形態ごとの配置。戻り値はスケール
    function layout(e, now, time, n, out) {
      if (mode === 'tunnel') {
        if (e.state === 'live') {
          const liveR = Math.max(30, (n * 26) / TAU);
          const a = (e.liveIndex / n) * TAU + spin * 0.5 + time * 0.03;
          out.set(Math.cos(a) * liveR * sx, Math.sin(a) * liveR * 0.8, -4 + Math.sin(time * 0.6 + e.hash * 9) * 1.6);
          return 1.3;
        }
        const z = timeToZ(e.t, now) + (e.hash2 - 0.5) * 7;
        const a = e.hash * TAU + spin + z * 0.0045;
        let r = e.baseR;
        if (e.state === 'future') {
          // 開始が近づくほど、トンネルの中心（NOWゲート）へ吸い寄せられる
          const k = smooth(120, 0, (e.t - now) / 60000);
          r = lerp(r, r * 0.32 + 5, k * k);
        }
        out.set(Math.cos(a) * r * sx, Math.sin(a) * r * 0.82 + Math.sin(time * 0.7 + e.hash * 20) * 0.6, z);
        return e.state === 'past' ? 0.85 : 1;
      }
      // GALAXY
      if (e.state === 'live') {
        const liveR = Math.max(36, (n * 21) / TAU);
        const a = (e.liveIndex / n) * TAU + spin + time * 0.04;
        out.set(Math.cos(a) * liveR, 5 + Math.sin(time * 0.6 + e.hash * 9) * 1.2, Math.sin(a) * liveR);
        return 1.05;
      }
      if (e.state === 'future') {
        // 核の上空に伸びる漏斗。時間が来るとらせんを描いて核へ降りてくる
        const h = (e.t - now) / HOUR;
        const th = e.hash * TAU + spin + h * 0.8;
        const r = G.rF(h);
        out.set(Math.cos(th) * r, G.yF(h), Math.sin(th) * r);
        return 1;
      }
      galaxyPast(e, (now - e.t) / HOUR, out);
      return 0.9;
    }

    // ================================================================
    //  彗星の尾（開始時刻からずっと配信中の星）
    // ================================================================
    function makeTail(e) {
      const pos = new Float32Array(TAIL_N * 2 * 3);
      const aS = new Float32Array(TAIL_N * 2), aSide = new Float32Array(TAIL_N * 2);
      for (let i = 0; i < TAIL_N; i++) {
        aS[i * 2] = aS[i * 2 + 1] = i / (TAIL_N - 1);
        aSide[i * 2] = -1; aSide[i * 2 + 1] = 1;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
      geo.setAttribute('aSide', new THREE.BufferAttribute(aSide, 1));
      geo.setIndex(tailIndex);
      const mat = new THREE.ShaderMaterial({
        uniforms: { uColor: { value: e.color.clone() }, uAlpha: { value: 0 }, uTime },
        vertexShader: TAIL_VERT, fragmentShader: TAIL_FRAG,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false;
      const label = makeTextSprite(`IGNITION ${e.v.displayDate}`, { size: 48, weight: 700, color: '#ffe0ea', height: 2.4, glow: e.hex });
      const mark = new THREE.Mesh(quadGeo, makeRingMaterial(e.hex, 1.6, 12, 0.05, 0));
      scene.add(mesh, label, mark);
      return { mesh, label, mark, pts: Array.from({ length: TAIL_N }, () => new THREE.Vector3()) };
    }

    const tA = new THREE.Vector3(), tB = new THREE.Vector3(), tC = new THREE.Vector3(), tD = new THREE.Vector3();
    function updateTail(e, now, alpha) {
      if (!e.tail) e.tail = makeTail(e);
      const T = e.tail;
      const el = Math.max((now - e.t) / HOUR, 0.08);
      const head = e.pos;
      pastPos(e, 0, tA);
      tB.subVectors(head, tA); // 現在位置と「0時間前の軌道」のずれ → 尾の根元で徐々に吸収
      for (let i = 0; i < TAIL_N; i++) {
        const s = i / (TAIL_N - 1);
        pastPos(e, s * el, T.pts[i]).addScaledVector(tB, Math.pow(1 - s, 2));
      }
      const arr = T.mesh.geometry.attributes.position.array;
      const wMul = mode === 'galaxy' ? 2.2 : 1.2;
      for (let i = 0; i < TAIL_N; i++) {
        const s = i / (TAIL_N - 1);
        const p = T.pts[i];
        tC.subVectors(T.pts[Math.min(i + 1, TAIL_N - 1)], T.pts[Math.max(i - 1, 0)]);
        tD.subVectors(camera.position, p);
        tC.cross(tD).normalize().multiplyScalar(lerp(3.0, 0.35, s) * wMul);
        arr[i * 6] = p.x - tC.x; arr[i * 6 + 1] = p.y - tC.y; arr[i * 6 + 2] = p.z - tC.z;
        arr[i * 6 + 3] = p.x + tC.x; arr[i * 6 + 4] = p.y + tC.y; arr[i * 6 + 5] = p.z + tC.z;
      }
      T.mesh.geometry.attributes.position.needsUpdate = true;
      T.mesh.material.uniforms.uAlpha.value = alpha;
      const end = T.pts[TAIL_N - 1];
      T.mark.position.copy(end);
      T.mark.quaternion.copy(camera.quaternion);
      T.mark.scale.setScalar(mode === 'galaxy' ? 9 : 7);
      T.mark.material.uniforms.uOpacity.value = 1.6 * alpha;
      T.label.position.set(end.x, end.y + (mode === 'galaxy' ? 6 : 5), end.z);
      T.label.material.opacity = alpha;
      T.mesh.visible = T.label.visible = T.mark.visible = alpha > 0.01;
    }
    function hideTail(e) {
      if (e.tail) e.tail.mesh.visible = e.tail.label.visible = e.tail.mark.visible = false;
    }

    // ================================================================
    //  同一タレントの配信を結ぶ「星座線」
    // ================================================================
    let talentLines = [];
    function rebuildTalentLines() {
      talentLines.forEach(({ line }) => { scene.remove(line); line.geometry.dispose(); line.material.dispose(); });
      talentLines = [];
      const by = new Map();
      entries.forEach((e) => {
        if (e.dying) return;
        const k = e.v.talent.name;
        if (!by.has(k)) by.set(k, []);
        by.get(k).push(e);
      });
      by.forEach((list) => {
        if (list.length < 2) return;
        list.sort((a, b) => a.t - b.t);
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(list.length * 3), 3));
        const mat = new THREE.LineBasicMaterial({
          color: list[0].color, transparent: true, opacity: 0.2,
          blending: THREE.AdditiveBlending, depthWrite: false,
        });
        const line = new THREE.Line(geo, mat);
        line.frustumCulled = false;
        scene.add(line);
        talentLines.push({ line, list });
      });
    }

    // ================================================================
    //  時刻マーカー（TUNNEL: 毎時ラベル/3時間リング/日付ゲート, GALAXY: 年輪）
    // ================================================================
    let markers = [];
    function buildMarkers() {
      markers.forEach((m) => {
        [m.ring, m.gRing].forEach((r) => { if (r) { scene.remove(r); r.material.dispose(); } });
        [m.label, m.gLabel].forEach((l) => { if (l) { scene.remove(l); disposeSprite(l); } });
      });
      markers = [];
      for (let t = Math.floor(tMin / HOUR) * HOUR; t <= tMax + HOUR; t += HOUR) {
        const p = jst(t);
        const isDay = p.h === 0;
        const m = { t, isDay };
        if (p.h % 3 === 0) {
          m.ring = new THREE.Mesh(quadGeo, isDay
            ? makeRingMaterial(0x7fd8ff, 0.9, 0, 0, 1)
            : makeRingMaterial(0x9d8cff, 0.22, 48, 0.004, 1));
          m.gRing = new THREE.Mesh(quadGeo, isDay
            ? makeRingMaterial(0x7fd8ff, 0.8, 0, 0, 1)
            : makeRingMaterial(0x9d8cff, 0.16, 90, 0.003, 0));
          m.gRing.rotation.x = -Math.PI / 2;
          m.gLabel = isDay
            ? makeTextSprite(`${p.mo}/${p.da} ${WEEK_EN[p.wd]}`, { size: 80, weight: 300, color: '#cdefff', height: 7, glow: '#00d4ff' })
            : makeTextSprite(`${pad(p.h)}:00`, { size: 60, weight: 400, color: '#c4bcf2', height: 3.6 });
          if (isDay) m.gLabel.material.color.setScalar(1.25);
          scene.add(m.ring, m.gRing, m.gLabel);
        }
        m.label = isDay
          ? makeTextSprite(`${p.mo}/${p.da} ${WEEK_EN[p.wd]}`, { size: 80, weight: 300, color: '#cdefff', height: 7, glow: '#00d4ff' })
          : makeTextSprite(`${pad(p.h)}:00`, { size: 56, weight: 400, color: '#b7afe8', height: 2.6 });
        m.labelBase = isDay ? 1 : 0.6;
        if (isDay) m.label.material.color.setScalar(1.25);
        scene.add(m.label);
        markers.push(m);
      }
    }

    // ================================================================
    //  衝撃波（配信開始 / 新規検知）
    // ================================================================
    const shocks = [];
    function supernova(e, color = e.color, size = 170) {
      const mat = new THREE.ShaderMaterial({
        uniforms: { uColor: { value: color.clone() }, uP: { value: 0 } },
        vertexShader: QUAD_VERT, fragmentShader: SHOCK_FRAG,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      });
      const m = new THREE.Mesh(quadGeo, mat);
      m.scale.setScalar(size);
      scene.add(m);
      shocks.push({ m, e, life: 0 });
    }

    // ================================================================
    //  データ取得・反映
    // ================================================================
    let firstLoad = true;

    async function fetchData() {
      try {
        const res = await fetch(API_URL, { cache: 'no-store' });
        const json = await res.json();
        applyData(json);
      } catch (err) {
        console.error(err);
        if (!dataLoaded) {
          $('#loader-msg').textContent = '通信に失敗しました。時間をおいて再読み込みしてください。';
        }
      }
    }

    function applyData(json) {
      const now = Date.now();
      const seen = new Set();
      const detected = [];
      (json.dateGroupList || []).forEach((grp) => (grp.videoList || []).forEach((v) => {
        if (!v || !v.url || !v.talent) return;
        const id = videoId(v);
        if (seen.has(id)) return;
        seen.add(id);
        const e = entries.get(id);
        if (e) {
          const titleChanged = e.v.title !== v.title;
          e.v = v;
          e.t = parseT(v.datetime);
          if (titleChanged && focused === e) fillPanel(e);
        } else {
          const ne = createEntry(v, now, firstLoad);
          entries.set(id, ne);
          if (!firstLoad) detected.push(ne);
        }
      }));
      entries.forEach((e, id) => {
        if (!seen.has(id) && !e.dying) {
          e.dying = true;
          if (!firstLoad) logEvent('lost', 'SIGNAL LOST', `${e.v.displayDate} ${e.v.talent.name}`, e.hex);
        }
      });

      recomputeRange(now);
      rebuildTalentLines();
      buildMarkers();
      buildGalaxyDust(now);
      detected.forEach((e) => onDetected(e));
      buildTimeline();
      tick();
      if (firstLoad) {
        const n = [...entries.values()].filter((e) => !e.dying).length;
        logEvent('scan', 'SCAN COMPLETE', `${n} signals`);
        startIntro();
      }
      firstLoad = false;
      dataLoaded = true;
    }

    function recomputeRange(now) {
      const ts = [...entries.values()].filter((e) => !e.dying).map((e) => e.t);
      tMin = Math.min(now - HOUR, ...ts) - HOUR * 0.5;
      tMax = Math.max(now + HOUR, ...ts) + HOUR;
    }

    // 新しい枠を検知：レーダーでピン → 着弾したら水色の衝撃波
    function onDetected(e) {
      e.isNew = Date.now();
      e.pingPending = true;
      radarPings.push({ e, t0: performance.now() });
      logEvent('new', 'NEW SIGNAL', `${e.v.displayDate} ${e.v.talent.name}`, e.hex, e);
      toast(e, 'detect');
    }

    // 1秒ごと：状態遷移・カード再描画・HUD
    let lastLiveKey = '';
    function tick() {
      const now = Date.now();
      lives = [];
      nextEntry = null;
      entries.forEach((e) => {
        if (e.dying) return;
        const st = stateOf(e, now);
        if (st !== e.state) {
          if (st === 'live' && e.state === 'future' && dataLoaded) {
            supernova(e);
            toast(e, 'ignite');
            radarPings.push({ e, t0: performance.now() });
            logEvent('ignite', 'IGNITION', e.v.talent.name, e.hex, e);
          }
          e.state = st;
          if (focused === e) fillPanel(e);
        }
        if (st === 'live') lives.push(e);
        else if (st === 'future' && (!nextEntry || e.t < nextEntry.t)) nextEntry = e;
        if (cardKey(e, now) !== e.drawKey) drawCard(e, now);
        if (e.tlDot) e.tlDot.className = 'tl-dot ' + st + (e.isNew && now - e.isNew < 5 * 60000 ? ' new' : '');
      });
      lives.sort((a, b) => a.t - b.t || a.hash - b.hash);
      lives.forEach((e, i) => { e.liveIndex = i; });

      const key = lives.map((e) => e.id).join(',');
      if (key !== lastLiveKey) { lastLiveKey = key; updateDock(); }
      updateNext(now);
      const p = jst(now);
      nowLabel.userData.setText(`NOW  ${pad(p.h)}:${pad(p.mi)}`);
      nowLabelG.userData.setText(`NOW  ${pad(p.h)}:${pad(p.mi)}`);
      $('#tl-now').style.left = tlPct(now) + '%';
      const counts = { past: 0, live: 0, future: 0 };
      entries.forEach((e) => { if (!e.dying) counts[e.state]++; });
      $('#radar-count').textContent = `${counts.past}◌ ${counts.live}● ${counts.future}✦`;
      if (focused) updatePanelTime(focused);
    }

    // ================================================================
    //  HUD
    // ================================================================
    function updateDock() {
      $('#live-n').textContent = lives.length;
      const wrap = $('#dock-icons');
      wrap.textContent = '';
      if (!lives.length) {
        const s = document.createElement('span');
        s.className = 'dock-empty';
        s.textContent = '現在配信中の星はありません';
        wrap.appendChild(s);
        return;
      }
      lives.forEach((e) => {
        const b = document.createElement('button');
        b.style.setProperty('--c', e.hex);
        b.style.backgroundImage = `url("${e.v.talent.iconImageUrl}")`;
        b.title = `${e.v.talent.name}（${e.v.displayDate}〜）\n${e.v.title}`;
        b.addEventListener('click', () => focusEntry(e));
        wrap.appendChild(b);
      });
    }

    function updateNext(now) {
      const el = $('#next');
      if (!nextEntry) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      el.style.setProperty('--c', nextEntry.hex);
      const icon = $('#next-icon');
      if (icon.dataset.src !== nextEntry.v.talent.iconImageUrl) {
        icon.src = icon.dataset.src = nextEntry.v.talent.iconImageUrl;
      }
      $('#next-name').textContent = nextEntry.v.talent.name;
      $('#next-count').textContent = `${nextEntry.v.displayDate} 開始 · ${untilText(nextEntry.t - now)}`;
    }
    $('#next').addEventListener('click', () => {
      if (!nextEntry) return;
      warpTo((nextEntry.t - Date.now()) / HOUR);
      focusEntry(nextEntry);
    });

    // --- 形態切替 ---
    function updateModeUI() {
      document.querySelectorAll('#mode-switch button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
    }
    function setMode(m) {
      if (m === mode) return;
      mode = m;
      modeSwitchT = 0;
      try { localStorage.setItem('space-boost-mode', m); } catch (e) { /* 保存できなくても動く */ }
      updateModeUI();
    }
    document.querySelectorAll('#mode-switch button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
    updateModeUI();

    // --- タイムライン ---
    const tlPct = (t) => clamp((t - tMin) / (tMax - tMin), 0, 1) * 100;
    function buildTimeline() {
      const track = $('#tl-track');
      track.textContent = '';
      for (let t = Math.ceil((tMin + 9 * HOUR) / (24 * HOUR)) * 24 * HOUR - 9 * HOUR; t < tMax; t += 24 * HOUR) {
        const p = jst(t);
        const d = document.createElement('div');
        d.className = 'tl-day';
        d.style.left = tlPct(t) + '%';
        d.textContent = `${p.mo}/${p.da} ${WEEK[p.wd]}`;
        track.appendChild(d);
      }
      entries.forEach((e) => {
        if (e.dying) return;
        const d = document.createElement('i');
        d.className = 'tl-dot ' + e.state;
        d.style.left = tlPct(e.t) + '%';
        d.style.height = (8 + e.hash * 10) + 'px';
        d.style.background = e.hex;
        d.style.color = e.hex;
        track.appendChild(d);
        e.tlDot = d;
      });
    }
    const tlEl = $('#timeline');
    let tlDragging = false;
    function tlToHours(clientX) {
      const r = $('#tl-inner').getBoundingClientRect();
      const f = clamp((clientX - r.left) / r.width, 0, 1);
      return (tMin + f * (tMax - tMin) - Date.now()) / HOUR;
    }
    tlEl.addEventListener('pointerdown', (ev) => {
      tlDragging = true;
      tlEl.setPointerCapture(ev.pointerId);
      warpTo(tlToHours(ev.clientX));
      dismissHint();
    });
    tlEl.addEventListener('pointermove', (ev) => { if (tlDragging) warpTo(tlToHours(ev.clientX)); });
    tlEl.addEventListener('pointerup', () => { tlDragging = false; });
    tlEl.addEventListener('pointercancel', () => { tlDragging = false; });

    // --- クロノメーター ---
    let lastChrono = '';
    function updateChrono(now) {
      const t = now + viewH * HOUR;
      const p = jst(t);
      const rel = relText(viewH * HOUR);
      const key = `${p.h}:${p.mi}|${rel}`;
      $('#tl-view').style.left = tlPct(t) + '%';
      if (key === lastChrono) return;
      lastChrono = key;
      $('#chrono-time').textContent = `${pad(p.h)}:${pad(p.mi)}`;
      $('#chrono-date').textContent = `${p.mo}月${p.da}日 (${WEEK[p.wd]})`;
      const relEl = $('#chrono-rel');
      relEl.textContent = rel;
      relEl.className = 'chrono-rel ' + (rel === 'NOW' ? 'is-now' : viewH > 0 ? 'is-future' : 'is-past');
      $('#now-btn').classList.toggle('show', rel !== 'NOW');
    }
    $('#now-btn').addEventListener('click', () => warpTo(0));

    // --- ヒント ---
    let hintTimer = setTimeout(dismissHint, 14000);
    function dismissHint() { $('#hint').classList.add('gone'); clearTimeout(hintTimer); }

    // --- ツールチップ ---
    const tooltip = $('#tooltip');
    function showTooltip(e, x, y) {
      if (!e) { tooltip.classList.remove('show'); return; }
      const now = Date.now();
      tooltip.style.setProperty('--c', e.hex);
      $('#tt-name').textContent = e.v.talent.name;
      $('#tt-title').textContent = e.v.title;
      $('#tt-time').textContent = e.state === 'live' ? `● LIVE · ${e.v.displayDate}〜 ${elapsedText(now - e.t)}`
        : e.state === 'future' ? `${e.v.displayDate} 〜 · ${untilText(e.t - now)}` : `ARCHIVE · ${e.v.displayDate} · ${agoText(now - e.t)}`;
      const w = 330, h = 110;
      tooltip.style.left = Math.min(x, window.innerWidth - w - 20) + 'px';
      tooltip.style.top = Math.min(y, window.innerHeight - h - 20) + 'px';
      tooltip.classList.add('show');
    }

    // --- 捕獲パネル ---
    const panel = $('#panel');
    function fillPanel(e) {
      const v = e.v;
      panel.style.setProperty('--c', e.hex);
      const st = $('#p-state');
      st.dataset.state = e.state;
      st.textContent = e.state === 'live' ? '● ON AIR' : e.state === 'future' ? '✦ UPCOMING STAR' : '◌ ARCHIVE';
      updatePanelTime(e);
      $('#p-title').textContent = v.title;
      $('#p-icon').src = v.talent.iconImageUrl;
      $('#p-name').textContent = v.talent.name;
      const col = $('#p-collabs');
      col.textContent = '';
      const collabs = v.collaboTalents || [];
      if (collabs.length) {
        const s = document.createElement('span');
        s.textContent = 'WITH';
        col.appendChild(s);
        collabs.forEach((c) => {
          const img = document.createElement('img');
          img.src = c.iconImageUrl;
          img.alt = img.title = c.name;
          img.style.setProperty('--cc', talentHex(c.name));
          col.appendChild(img);
        });
      }
      $('#p-go').href = v.url;
      $('#p-go').textContent = e.state === 'past' ? '▶ アーカイブを観測する' : '▶ YouTube で観測する';
    }
    function updatePanelTime(e) {
      const now = Date.now();
