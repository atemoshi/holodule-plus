      const head = `${p.mo}/${p.da} (${WEEK[p.wd]}) ${e.v.displayDate}`;
      $('#p-time').textContent = e.state === 'live' ? `${head} 開始 · ${elapsedText(now - e.t)}`
        : e.state === 'future' ? `${head} 開始予定 · ${untilText(e.t - now)}` : `${head} 配信 · ${agoText(now - e.t)}`;
    }
    function focusEntry(e) {
      if (!e || e.dying) return;
      focused = e;
      fillPanel(e);
      panel.classList.add('show');
      document.body.classList.add('focusing');
      showTooltip(null);
      dismissHint();
    }
    function unfocus() {
      focused = null;
      panel.classList.remove('show');
      document.body.classList.remove('focusing');
    }
    $('#panel-close').addEventListener('click', unfocus);

    // --- トースト（配信開始 / 新規検知） ---
    function toast(e, kind) {
      const a = document.createElement('a');
      a.className = 'toast ' + kind;
      a.href = e.v.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.setProperty('--c', kind === 'detect' ? '#7fe8ff' : e.hex);
      const img = document.createElement('img');
      img.src = e.v.talent.iconImageUrl;
      const info = document.createElement('div');
      const k = document.createElement('div'); k.className = 'toast-kicker';
      k.textContent = kind === 'detect' ? `◈ NEW SIGNAL — ${e.v.displayDate} 新規枠を検知` : '✦ IGNITION — 配信開始';
      const n = document.createElement('div'); n.className = 'toast-name'; n.textContent = e.v.talent.name;
      const t = document.createElement('div'); t.className = 'toast-title'; t.textContent = e.v.title;
      info.append(k, n, t);
      a.append(img, info);
      const box = $('#toasts');
      box.appendChild(a);
      // 同時に重なっても画面を覆わないよう最大2件
      while (box.children.length > 2) box.firstElementChild.remove();
      setTimeout(() => { a.classList.add('out'); setTimeout(() => a.remove(), 700); }, 7000);
    }

    // ================================================================
    //  SIGNAL RADAR（新しい星の検知）
    // ================================================================
    const radarCv = $('#radar-cv');
    const rg = radarCv.getContext('2d');
    const radarPings = [];
    let radarSize = 0;
    function sizeRadar() {
      const s = radarCv.clientWidth;
      const dpr = Math.min(window.devicePixelRatio, 2);
      radarCv.width = Math.round(s * dpr);
      radarCv.height = Math.round(s * dpr);
      rg.setTransform(dpr, 0, 0, dpr, 0, 0);
      radarSize = s;
    }
    sizeRadar();
    // 半径 = 今からの時間差（平方根スケール、36時間で外周）
    const radarRadius = (hAbs) => Math.sqrt(Math.min(hAbs, 36) / 36) * 0.9 + 0.1;

    function drawRadar(time) {
      const S = radarSize;
      if (!S) return;
      const c = S / 2, R = S / 2 - 3;
      rg.clearRect(0, 0, S, S);
      const bg = rg.createRadialGradient(c, c, 0, c, c, R);
      bg.addColorStop(0, 'rgba(60,30,90,.55)'); bg.addColorStop(1, 'rgba(6,4,18,.35)');
      rg.fillStyle = bg;
      rg.beginPath(); rg.arc(c, c, R, 0, TAU); rg.fill();

      // 時間の同心円（1h / 3h / 6h / 12h / 24h）
      rg.lineWidth = 1;
      [1, 3, 6, 12, 24].forEach((h) => {
        rg.strokeStyle = h === 24 ? 'rgba(127,216,255,.28)' : 'rgba(150,170,255,.13)';
        rg.beginPath(); rg.arc(c, c, radarRadius(h) * R, 0, TAU); rg.stroke();
      });
      rg.strokeStyle = 'rgba(150,170,255,.1)';
      rg.beginPath(); rg.moveTo(c - R, c); rg.lineTo(c + R, c); rg.moveTo(c, c - R); rg.lineTo(c, c + R); rg.stroke();

      // 観測中の時刻
      if (Math.abs(viewH) > 0.05) {
        rg.setLineDash([3, 4]);
        rg.strokeStyle = 'rgba(127,232,255,.7)';
        rg.beginPath(); rg.arc(c, c, radarRadius(Math.abs(viewH)) * R, 0, TAU); rg.stroke();
        rg.setLineDash([]);
      }

      // スイープ
      const sa = (time * 1.3) % TAU;
      if (rg.createConicGradient) {
        const cg = rg.createConicGradient(-sa, c, c);
        cg.addColorStop(0, 'rgba(127,232,255,.32)');
        cg.addColorStop(0.16, 'rgba(127,232,255,0)');
        cg.addColorStop(1, 'rgba(127,232,255,0)');
        rg.fillStyle = cg;
        rg.beginPath(); rg.arc(c, c, R, 0, TAU); rg.fill();
      }
      rg.strokeStyle = 'rgba(160,240,255,.8)';
      rg.beginPath(); rg.moveTo(c, c); rg.lineTo(c + Math.cos(sa) * R, c - Math.sin(sa) * R); rg.stroke();

      // ブリップ
      const pulse = 0.5 + 0.5 * Math.sin(time * 5);
      entries.forEach((e) => {
        if (e.dying || e.spawnDelay > 0) { e.rx = e.ry = -99; return; }
        const x = c + Math.cos(e.radarA) * e.radarR * R;
        const y = c - Math.sin(e.radarA) * e.radarR * R;
        e.rx = x; e.ry = y;
        const d = (((sa - e.radarA) % TAU) + TAU) % TAU;
        const lit = 0.25 + 0.75 * Math.exp(-d * 1.5);
        rg.fillStyle = e.hex;
        if (e.state === 'past') {
          rg.globalAlpha = 0.14 + 0.4 * lit;
          rg.beginPath(); rg.arc(x, y, 1.4, 0, TAU); rg.fill();
        } else if (e.state === 'future') {
          rg.globalAlpha = 0.5 + 0.5 * lit;
          rg.shadowColor = e.hex; rg.shadowBlur = 8;
          rg.beginPath(); rg.arc(x, y, e === nextEntry ? 3.4 : 2.4, 0, TAU); rg.fill();
          rg.shadowBlur = 0;
        } else {
          rg.globalAlpha = 1;
          rg.shadowColor = '#ff3b5c'; rg.shadowBlur = 10;
          rg.beginPath(); rg.arc(x, y, 3, 0, TAU); rg.fill();
          rg.shadowBlur = 0;
          rg.strokeStyle = `rgba(255,80,110,${0.3 + 0.6 * pulse})`;
          rg.beginPath(); rg.arc(x, y, 5 + pulse * 2, 0, TAU); rg.stroke();
        }
        if (e === focused) {
          rg.globalAlpha = 1;
          rg.strokeStyle = '#fff';
          rg.beginPath(); rg.arc(x, y, 6, 0, TAU); rg.stroke();
        }
      });
      rg.globalAlpha = 1;

      // 検知ピン
      const pnow = performance.now();
      for (let i = radarPings.length - 1; i >= 0; i--) {
        const pg = radarPings[i];
        const p = (pnow - pg.t0) / 1000;
        if (p > 6 || pg.e.rx < 0) { if (p > 6) radarPings.splice(i, 1); continue; }
        for (let k = 0; k < 3; k++) {
          const q = (p - k * 0.45) % 2;
          if (q < 0 || q > 1.4) continue;
          rg.strokeStyle = `rgba(127,232,255,${(1 - q / 1.4) * 0.9})`;
          rg.lineWidth = 1.5;
          rg.beginPath(); rg.arc(pg.e.rx, pg.e.ry, 3 + q * 16, 0, TAU); rg.stroke();
        }
        rg.lineWidth = 1;
      }

      // 中心 = NOW
      rg.fillStyle = '#ff3b5c';
      rg.shadowColor = '#ff3b5c'; rg.shadowBlur = 8;
      rg.beginPath(); rg.arc(c, c, 2.2, 0, TAU); rg.fill();
      rg.shadowBlur = 0;
    }

    radarCv.addEventListener('pointerdown', (ev) => {
      const r = radarCv.getBoundingClientRect();
      const x = ev.clientX - r.left, y = ev.clientY - r.top;
      let best = null, bd = 12;
      entries.forEach((e) => {
        if (e.dying) return;
        const d = Math.hypot(e.rx - x, e.ry - y);
        if (d < bd) { bd = d; best = e; }
      });
      if (best) {
        if (best.state !== 'live') warpTo((best.t - Date.now()) / HOUR);
        focusEntry(best);
      }
    });

    function logEvent(kind, label, text, hex = null, e = null) {
      const ul = $('#radar-log');
      const li = document.createElement('li');
      li.className = 'log-' + kind + (e ? ' clickable' : '');
      const tm = document.createElement('time'); tm.textContent = hm(Date.now());
      const dot = document.createElement('i'); if (hex) dot.style.setProperty('--c', hex);
      const b = document.createElement('b'); b.textContent = label;
      const sp = document.createElement('span'); sp.textContent = text;
      li.append(tm, dot, b, sp);
      if (e) li.addEventListener('click', () => { if (!e.dying) focusEntry(e); });
      ul.prepend(li);
      while (ul.children.length > 5) ul.lastElementChild.remove();
    }

    // ================================================================
    //  操作：手繰り寄せる
    // ================================================================
    let viewH = 0;          // 注視している時刻（今からの時間差）
    let viewVel = 0;        // 時間/秒
    let warpTarget = null;
    let spin = 0, spinVel = 0;
    let dragging = false;
    let down = null;
    const mouse = new THREE.Vector2(0, 0);
    const mouseS = new THREE.Vector2(0, 0);
    const raycaster = new THREE.Raycaster();

    function warpTo(h) { warpTarget = h; viewVel = 0; }
    function hRange() {
      const now = Date.now();
      return [(tMin - now) / HOUR - 0.2, (tMax - now) / HOUR];
    }

    function pick(clientX, clientY) {
      const ndc = new THREE.Vector2((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
      raycaster.setFromCamera(ndc, camera);
      const meshes = [];
      entries.forEach((e) => { if (!e.dying && e.group.visible && e.spawn > 0.9) meshes.push(e.mesh); });
      const hit = raycaster.intersectObjects(meshes, false)[0];
      return hit ? hit.object.userData.entry : null;
    }

    canvas.addEventListener('pointerdown', (ev) => {
      canvas.setPointerCapture(ev.pointerId);
      dragging = true;
      down = { x: ev.clientX, y: ev.clientY, lx: ev.clientX, ly: ev.clientY, lt: performance.now(), moved: false, vy: 0, vx: 0 };
      warpTarget = null;
      viewVel = 0;
      spinVel = 0;
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (ev) => {
      mouse.set((ev.clientX / window.innerWidth) * 2 - 1, -(ev.clientY / window.innerHeight) * 2 + 1);
      if (dragging && down) {
        const dx = ev.clientX - down.lx, dy = ev.clientY - down.ly;
        const nowT = performance.now();
        const dt = Math.max(1, nowT - down.lt) / 1000;
        if (Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) {
          if (!down.moved) dismissHint();
          down.moved = true;
        }
        if (down.moved) {
          // 下に引く＝未来を手元へ手繰り寄せる
          const dh = dy * (4 / window.innerHeight);
          viewH += dh;
          spin += dx * 0.0035;
          down.vy = lerp(down.vy, dh / dt, 0.4);
          down.vx = lerp(down.vx, (dx * 0.0035) / dt, 0.4);
        }
        down.lx = ev.clientX; down.ly = ev.clientY; down.lt = nowT;
        return;
      }
      if (ev.pointerType === 'mouse') {
        const e = pick(ev.clientX, ev.clientY);
        hovered = e;
        canvas.classList.toggle('pointing', !!e);
        showTooltip(e && e !== focused ? e : null, ev.clientX, ev.clientY);
      }
    });

    function endDrag(ev) {
      if (!dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      if (down && !down.moved && ev.type === 'pointerup') {
        const e = pick(ev.clientX, ev.clientY);
        if (e) {
          if (e === focused) window.open(e.v.url, '_blank', 'noopener');
          else focusEntry(e);
        } else if (focused) {
          unfocus();
        }
      } else if (down) {
        viewVel = clamp(down.vy, -12, 12);
        spinVel = clamp(down.vx, -3, 3);
      }
      down = null;
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('pointerleave', () => { if (!dragging) { hovered = null; showTooltip(null); } });

    window.addEventListener('wheel', (ev) => {
      if (ev.target.closest && ev.target.closest('.panel, .dock, .radar')) return;
      ev.preventDefault();
      const unit = ev.deltaMode === 1 ? 33 : ev.deltaMode === 2 ? window.innerHeight : 1;
      const boost = ev.shiftKey ? 4 : 1;
      warpTarget = null;
      viewVel += ev.deltaY * unit * 0.0075 * boost;
      viewVel = clamp(viewVel, -30, 30);
      dismissHint();
    }, { passive: false });

    window.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') unfocus();
      else if (ev.key === 'ArrowDown' || ev.key === 's') { warpTarget = null; viewVel += ev.shiftKey ? 4 : 1.2; }
      else if (ev.key === 'ArrowUp' || ev.key === 'w') { warpTarget = null; viewVel -= ev.shiftKey ? 4 : 1.2; }
      else if (ev.key === 'ArrowLeft' || ev.key === 'a') spinVel -= 0.6;
      else if (ev.key === 'ArrowRight' || ev.key === 'd') spinVel += 0.6;
      else if (ev.key === 'g' || ev.key === 'G') setMode(mode === 'galaxy' ? 'tunnel' : 'galaxy');
      else if (ev.key === ' ' || ev.key === 'Home') { ev.preventDefault(); warpTo(0); }
      else return;
      dismissHint();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
      updateAspect();
      sizeRadar();
    });

    // ================================================================
    //  イントロ
    // ================================================================
    let introT = 1;
    function startIntro() {
      introT = 0;
      viewH = -1.4;
      // TUNNELで配信中の星がない静かな時間帯は、次の恒星の手前まで自動で航行する
      const nextH = nextEntry ? (nextEntry.t - Date.now()) / HOUR : 0;
      warpTo(mode === 'tunnel' && lives.length === 0 && nextH > 1.5 ? nextH - 1.1 : 0);
      document.body.classList.add('ready');
    }

    // ================================================================
    //  メインループ
    // ================================================================
    const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
    const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3();
    const camDesired = new THREE.Vector3(), lookDesired = new THREE.Vector3(), camLook = new THREE.Vector3(0, 0, -50);
    const prevCam = new THREE.Vector3().copy(camera.position);
    const clock = new THREE.Clock();
    let camSpeed = 0, camVelZ = 0, dimK = 0;

    function focusTarget(out) {
      const D = 24;
      camera.getWorldDirection(fwd);
      right.set(1, 0, 0).applyQuaternion(camera.quaternion);
      up.set(0, 1, 0).applyQuaternion(camera.quaternion);
      out.copy(camera.position).addScaledVector(fwd, D);
      const visH = 2 * D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const visW = visH * camera.aspect;
      if (isNarrow()) out.addScaledVector(up, visH * 0.2);
      else out.addScaledVector(right, -visW * 0.17);
      return Math.min(1.05, (visW * (isNarrow() ? 0.88 : 0.5)) / CARD_W, (visH * (isNarrow() ? 0.42 : 0.62)) / CARD_H);
    }

    // GALAXY: 見ている時刻に応じた視点（過去＝円盤を俯瞰して引く、未来＝漏斗を横から見上げる）
    function galaxyView(h, outTarget) {
      const aspectK = 1 / clamp(camera.aspect / 1.25, 0.5, 1);
      if (h <= 0) {
        const a = -h;
        outTarget.set(0, 0, 0);
        return { D: (160 + G.r(a) * 1.25) * aspectK, el: 0.8 - smooth(0, 24, a) * 0.22 };
      }
      outTarget.set(0, (G.yF(h) - 10) * 0.9, 0);
      return { D: (180 + (G.rF(h) - 12) * 2.4) * aspectK, el: lerp(0.8, 0.2, smooth(0, 2.5, h)) };
    }

    function updateCamera(dt, now) {
      const [h0, h1] = hRange();
      if (warpTarget !== null) {
        warpTarget = clamp(warpTarget, h0, h1);
        viewH = lerp(viewH, warpTarget, 1 - Math.exp(-dt * 3.4));
        if (Math.abs(viewH - warpTarget) < 0.002) { viewH = warpTarget; warpTarget = null; }
      } else if (!dragging) {
        viewH += viewVel * dt;
        viewVel *= Math.exp(-dt * 2.4);
      }
      if (viewH < h0) { viewH = lerp(viewH, h0, 1 - Math.exp(-dt * 8)); viewVel = Math.max(viewVel, 0); }
      if (viewH > h1) { viewH = lerp(viewH, h1, 1 - Math.exp(-dt * 8)); viewVel = Math.min(viewVel, 0); }

      if (!dragging) { spin += spinVel * dt; spinVel *= Math.exp(-dt * 1.8); }
      spin += dt * 0.012;

      mouseS.lerp(mouse, 1 - Math.exp(-dt * 2));
      if (mode === 'tunnel') {
        const camZ = -viewH * Z_PER_HOUR + FOCUS_DIST;
        camDesired.set(mouseS.x * 6 * sx, mouseS.y * 4, camZ);
        lookDesired.set(camDesired.x * 0.25, camDesired.y * 0.25, camZ - 120);
      } else {
        const { D, el } = galaxyView(viewH, lookDesired);
        const az = mouseS.x * 0.14;
        const e2 = el + mouseS.y * 0.06;
        camDesired.set(
          lookDesired.x + Math.sin(az) * Math.cos(e2) * D,
          lookDesired.y + Math.sin(e2) * D,
          lookDesired.z + Math.cos(az) * Math.cos(e2) * D
        );
      }
      // 形態切替中はゆっくり、普段はほぼ追従
      modeSwitchT = Math.min(1, modeSwitchT + dt / 2.2);
      const rate = modeSwitchT < 1 ? 1.2 + 6 * easeInOut(modeSwitchT) : 14;
      const k = 1 - Math.exp(-dt * rate);
      camera.position.lerp(camDesired, k);
      camLook.lerp(lookDesired, k);
      camera.lookAt(camLook);

      const d = dt > 1e-3 ? 1 / dt : 0;
      camSpeed = lerp(camSpeed, camera.position.distanceTo(prevCam) * d, 0.2);
      camVelZ = lerp(camVelZ, (camera.position.z - prevCam.z) * d, 0.2);
      prevCam.copy(camera.position);

      // ワープ感：速度でFOVが広がる
      if (introT < 1) introT = Math.min(1, introT + dt / 3.2);
      const introFov = lerp(118, 0, easeOutExpo(introT));
      camera.fov = BASE_FOV + clamp(camSpeed * 0.05, 0, 22) + introFov;
      camera.updateProjectionMatrix();

      modeK = approach(modeK, mode === 'galaxy' ? 1 : 0, dt / 1.2);
      scene.fog.density = lerp(0.0015, 0.0007, modeK);

      starfield.position.copy(camera.position);
      nebula.position.copy(camera.position);
      dustMat.uniforms.uCamZ.value = camera.position.z;
      dustMat.uniforms.uVel.value = -camVelZ * 0.1;
      dustMat.uniforms.uK.value = 1 - modeK;
      dust.visible = modeK < 0.99;
    }

    function updateEntries(dt, now, time) {
      const n = Math.max(1, lives.length);
      dimK = approach(dimK, focused ? 1 : 0, dt * 2.5);
      const focusScale = focusTarget(tmp2);
      const lensW = 0.5 + Math.abs(viewH) * 0.12;

      entries.forEach((e) => {
        // ---- レイアウト ----
        let s = layout(e, now, time, n, tmp);

        // GALAXY: 見ている時刻の星を円盤から浮かせて大きくする（時のレンズ）
        let lens = 0;
        if (mode === 'galaxy' && e.state !== 'live') {
          lens = Math.exp(-Math.pow(((e.t - now) / HOUR - viewH) / lensW, 2)) * modeK;
          // 遠くから見ているときほど大きく浮かせる
          const lensScale = 0.7 + Math.min(Math.abs(viewH), 30) * 0.07;
          s *= 1 + lensScale * lens;
          tmp.y += (7 + Math.abs(viewH) * 0.6) * lens;
        }

        if (e.spawnDelay > 0) { e.spawnDelay -= dt; e.group.visible = false; return; }
        e.group.visible = true;
        if (e.spawn < 1) {
          e.spawn = Math.min(1, e.spawn + dt / 2.4);
          const k = easeOutExpo(e.spawn);
          e.pos.copy(tmp).addScaledVector(fwd, 2800 * (1 - k));
        } else {
          e.pos.lerp(tmp, 1 - Math.exp(-dt * (modeSwitchT < 1 ? 2.2 : 3.5)));
          if (e.pingPending) { e.pingPending = false; supernova(e, CYAN, 120); }
        }

        e.hover = approach(e.hover, hovered === e && !focused ? 1 : 0, dt * 6);
        e.focusT = approach(e.focusT, focused === e ? 1 : 0, dt * 1.6);
        const baseScale = s * (1 + 0.16 * e.hover);
        if (e.focusT > 0) {
          const k = easeInOut(e.focusT);
          e.group.position.lerpVectors(e.pos, tmp2, k);
          e.group.scale.setScalar(lerp(baseScale, focusScale, k));
        } else {
          e.group.position.copy(e.pos);
          e.group.scale.setScalar(baseScale);
        }
        e.group.quaternion.copy(camera.quaternion);

        // レーダー座標：TUNNELは画面の向き、GALAXYは真上から見た円盤
        e.radarR = e.state === 'live' ? 0.1 + 0.03 * Math.min((now - e.t) / HOUR, 3) : radarRadius(Math.abs(e.t - now) / HOUR);
        e.radarA = mode === 'tunnel' ? Math.atan2(e.pos.y, e.pos.x) : Math.atan2(-e.pos.z, e.pos.x);

        // ---- 明るさ ----
        if (e.dying) e.appear = approach(e.appear, 0, dt * 0.8);
        const dist = e.group.position.distanceTo(camera.position);
        const nearFade = e.focusT > 0.01 ? 1 : smooth(6, 16, dist);
        const dim = lerp(1, e === focused ? 1 : 0.22, dimK);
        // 過去の星は時間とともに冷えていく（直近ほど明るい残光）
        const ageH = (now - e.t) / HOUR;
        const base = e.state === 'past' ? lerp(0.74, 0.36, smooth(0, 14, ageH)) : 0.86;
        e.mat.color.setScalar(base * dim * (1 + 0.12 * e.hover + 0.15 * lens));
        e.mat.opacity = e.appear * nearFade;
        e.mat.depthWrite = e.mat.opacity > 0.95;

        // ---- 恒星 ----
        let size = 0, inten = 0, rays = 0, pulse = 0, live = 0;
        if (e.state === 'live') {
          size = 46; inten = 1.15; rays = 0.3; pulse = 0.6; live = 1;
        } else if (e.state === 'future') {
          const h = (e.t - now) / HOUR;
          if (h < 1) { const k = 1 - h; size = 72 + k * 56; inten = 1.5 + k * 2.0; rays = 1.25; pulse = 1; }
          else if (h < 6) { const k = (6 - h) / 5; size = 44 + k * 24; inten = 0.55 + k * 0.85; rays = 0.6 + k * 0.5; }
          else { size = 36; inten = 0.45; rays = 0.4; }
          if (e === nextEntry) { size *= 1.3; inten *= 1.25; }
        } else {
          // 残光：終わった直後ほどタレントカラーでほのかに光る
          size = 30; inten = 0.08 + 0.4 * (1 - smooth(0, 6, ageH)); rays = 0.15 * (1 - smooth(0, 3, ageH));
        }
        inten *= 1 + lens * 0.3;
        // GALAXYは星が核の周りに集まるので、光を少し絞って白飛びを防ぐ
        if (e.state !== 'past') { size *= lerp(1, 0.7, modeK); inten *= lerp(1, 0.7, modeK); }
        const u = e.starMat.uniforms;
        e.star.scale.setScalar(size * lerp(1, 0.6, e.focusT));
        u.uIntensity.value = inten * dim * e.appear * (e.spawn < 1 ? 0.6 + e.spawn * 0.4 : 1) * lerp(1, 0.55, e.focusT);
        u.uRays.value = rays;
        u.uPulse.value = pulse;
        u.uLive.value = live;
        u.uElapsed.value = clamp(ageH / 3, 0, 1);
        u.uFade.value = e.focusT > 0.01 ? 1 : smooth(5, 34, dist);
        e.star.visible = inten > 0.01;

        // ---- 彗星の尾 ----
        if (e.state === 'live' && e.spawn >= 1) updateTail(e, now, 0.9 * dim * e.appear);
        else hideTail(e);

        // ---- 衛星（コラボ） ----
        const ns = e.sats.length;
        const R = 10.8, sc = ns > 6 ? 2.6 : 3.4;
        e.sats.forEach((sat, i) => {
          const a = time * 0.55 + (i / ns) * TAU + e.hash * 6;
          sat.position.set(Math.cos(a) * R, Math.sin(a) * R * 0.3 - 1.2, Math.sin(a) * 4.5);
          sat.scale.setScalar(sc);
          sat.material.color.setScalar(base * dim * 1.05);
          sat.material.opacity = e.mat.opacity;
        });

        if (e.dying && e.appear <= 0) {
          disposeEntry(e);
          entries.delete(e.id);
          if (focused === e) unfocus();
          rebuildTalentLines();
        }
      });

      // 星座線
      talentLines.forEach(({ line, list }) => {
        const arr = line.geometry.attributes.position.array;
        list.forEach((e, i) => { arr[i * 3] = e.pos.x; arr[i * 3 + 1] = e.pos.y; arr[i * 3 + 2] = e.pos.z; });
        line.geometry.attributes.position.needsUpdate = true;
        line.material.opacity = 0.2 * lerp(1, 0.2, dimK) * (list.every((e) => e.spawn >= 1) ? 1 : 0);
      });
    }

    function updateMarkers(now) {
      const kT = 1 - modeK, kG = modeK;
      markers.forEach((m) => {
        const z = timeToZ(m.t, now);
        if (m.ring) {
          m.ring.position.set(0, 0, z);
          m.ring.scale.set(RING_R * 2 * sx, RING_R * 2 * 0.86, 1);
          m.ring.material.uniforms.uOpacity.value = m.ring.material.userData.base * kT;
          m.ring.visible = kT > 0.01;
        }
        const r = RING_R * (m.isDay ? 0.8 : 0.72);
        m.label.position.set(-r * sx, r * 0.86, z);
        m.label.material.opacity = m.labelBase * kT;
        m.label.visible = kT > 0.01;

        // GALAXY: 過去は円盤の年輪、未来は漏斗を囲む水平リング
        if (m.gRing) {
          let rr, y, fade;
          if (m.t <= now) {
            const a = (now - m.t) / HOUR;
            rr = G.r(a); y = 0; fade = 1 - smooth(34, 44, a);
          } else {
            const h = (m.t - now) / HOUR;
            rr = G.rF(h) + 6; y = G.yF(h); fade = 0.55;
          }
          m.gRing.position.set(0, y, 0);
          m.gRing.scale.setScalar((rr * 2) / 0.94);
          m.gRing.material.uniforms.uOpacity.value = m.gRing.material.userData.base * kG * fade;
          m.gRing.visible = kG * fade > 0.01;
          const th = Math.PI / 2 + 0.42;
          m.gLabel.position.set(Math.cos(th) * rr, y + 2.5, Math.sin(th) * rr);
          m.gLabel.material.opacity = kG * fade;
          m.gLabel.visible = kG * fade > 0.01;
        }
      });

      // TUNNEL: NOWゲート
      nowGate.visible = kT > 0.01;
      gateOuter.scale.set(RING_R * 2.1 * sx, RING_R * 2.1 * 0.86, 1);
      gateInner.scale.set(RING_R * 1.98 * sx, RING_R * 1.98 * 0.86, 1);
      gateHaze.scale.set(RING_R * 2.3 * sx, RING_R * 2.3 * 0.86, 1);
      nowLabel.position.set(0, RING_R * 1.05 * 0.86 + 4, 0);
      gateOuter.material.uniforms.uOpacity.value = (1.4 + Math.sin(uTime.value * 2) * 0.3) * kT;
      gateInner.material.uniforms.uOpacity.value = 0.9 * kT;
      gateHaze.material.uniforms.uOpacity.value = 0.7 * kT;
      nowLabel.material.opacity = kT;

      // GALAXY: 銀河核・観測リング
      galaxy.visible = kG > 0.01;
      coreStar.quaternion.copy(camera.quaternion);
      coreStar.scale.setScalar(70);
      coreStar.material.uniforms.uIntensity.value = 0.6 * kG * lerp(1, 0.4, dimK);
      accretionA.scale.setScalar((20 * 2) / 0.94);
      accretionB.scale.setScalar((13 * 2) / 0.94);
      accretionA.material.uniforms.uOpacity.value = 1.3 * kG;
      accretionB.material.uniforms.uOpacity.value = 1.0 * kG;
      nowLabelG.position.set(0, 17, 0);
      nowLabelG.material.opacity = kG;
      const fr = viewH <= 0 ? G.r(-viewH) : G.rF(viewH) + 8;
      focusRing.position.set(0, viewH <= 0 ? 0.5 : G.yF(viewH), 0);
      focusRing.scale.setScalar((fr * 2) / 0.94);
      focusRing.material.uniforms.uOpacity.value = 1.5 * kG * smooth(0.04, 0.3, Math.abs(viewH));
      gDustMat.uniforms.uNowH.value = (now - T0) / HOUR;
      gDustMat.uniforms.uSpin.value = spin;
      gDustMat.uniforms.uK.value = kG * lerp(1, 0.35, dimK);
    }

    function updateShocks(dt) {
      for (let i = shocks.length - 1; i >= 0; i--) {
        const s = shocks[i];
        s.life += dt / 2.6;
        s.m.material.uniforms.uP.value = s.life;
        s.m.position.copy(s.e.group.position);
        s.m.quaternion.copy(camera.quaternion);
        if (s.life >= 1) {
          scene.remove(s.m);
          s.m.material.dispose();
          shocks.splice(i, 1);
        }
      }
    }

    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      uTime.value += dt;
      const now = Date.now();
      updateCamera(dt, now);
      if (dataLoaded) {
        updateEntries(dt, now, uTime.value);
        updateMarkers(now);
        updateShocks(dt);
        updateChrono(now);
        drawRadar(uTime.value);
      }
      composer.render();
      requestAnimationFrame(frame);
    }

    // ================================================================
    //  デバッグ（本家🎲相当）
    //    spaceBoost.ignite()      次の恒星を点火（配信開始）
    //    spaceBoost.ignitePast(h) h時間前に始まった配信中の星を作る
    //    spaceBoost.detect()      新規枠の検知を擬似的に発生させる
    // ================================================================
    function fmtApi(t) {
      const p = jst(t);
      return `${p.y}/${pad(p.mo)}/${pad(p.da)} ${pad(p.h)}:${pad(p.mi)}:00`;
    }
    function fakeEntry(t) {
      const src = [...entries.values()].filter((e) => !e.dying);
      const base = src[(Math.random() * src.length) | 0].v;
      const v = { ...base, url: `https://www.youtube.com/watch?v=debug${Math.random().toString(36).slice(2, 8)}`, datetime: fmtApi(t), displayDate: hm(t), isLive: false };
      const e = createEntry(v, Date.now(), false);
      entries.set(e.id, e);
      recomputeRange(Date.now());
      rebuildTalentLines();
      buildTimeline();
      return e;
    }
    window.spaceBoost = {
      state: () => ({ mode, viewH, viewVel, warpTarget, dragging, spin, lives: lives.length }),
      ignite() {
        const e = nextEntry;
        if (!e) return null;
        e.v.isLive = true;
        tick();
        return e.v.talent.name;
      },
      ignitePast(h = 1.5) {
        const e = fakeEntry(Date.now() - h * HOUR);
        e.v.isLive = true;
        tick();
        return e.v.talent.name;
      },
      detect(h = 2) {
        const e = fakeEntry(Date.now() + h * HOUR);
        onDetected(e);
        tick();
        return e.v.talent.name;
      },
    };

    // ================================================================
    //  起動
    // ================================================================
    (async () => {
      requestAnimationFrame(frame);
      const fontsReady = Promise.race([
        Promise.all([
          document.fonts.load('700 40px "Zen Kaku Gothic New"'),
          document.fonts.load('600 27px Outfit'),
          document.fonts.load('300 80px Outfit'),
        ]),
        new Promise((r) => setTimeout(r, 2500)),
      ]).catch(() => {});
      await Promise.all([loadTalentColors(), fontsReady]);
      await fetchData();
      setInterval(tick, 1000);
      setInterval(fetchData, REFRESH_MS);
    })();
  </script>
</body>
